  const el = document.querySelector(`#app [data-a="${KFOC.a}"][data-v="${CSS.escape(KFOC.v || '')}"]`); if (el && el.offsetParent !== null){ el.focus({preventScroll:true}); el.classList.add('kcur'); el.scrollIntoView({block:'nearest'}); }
}

/* ---------- даты внутри документов и отчётов ---------- */
const DATE_ACT = {
  wipdate: v => { const w = S.wip; if (!w || w.date === v) return render(); const was = w.date; w.date = v; if (w.view){ w.view = false; } w.dirty = true; save(); render(); toast('Дата документа: ' + dShort(was) + ' → ' + dShort(v) + '. Не забудьте «Сохранить»'); },
  cddate: v => { keepCd(); if (R.cd){ R.cd.date = v; if (R.cd.id && !R.cedit) R.cedit = true; } render(); },
  mvdate: v => { MV.date = v; render(); },
  idrdate: v => { const cat = R.cat || 'cig', dr = S.drafts[cat]; if (!dr || (dr.disp || dr.date) === v) return render();
    const nd = addD(v, 1), ex = S.inv.find(i => i.cat === cat && i.date === nd && i.id !== dr.edit);
    confirmBox(`Поменять дату инвентаризации ${dShort(dr.disp || addD(dr.date, -1))} → <b>${dShort(v)}</b>?<br>Приход недели и балансы пересчитаются.${ex ? '<br><b>На эту дату уже есть инвентаризация — при сохранении она заменится.</b>' : ''}`, 'Поменять', () => { dr.disp = v; dr.date = nd; dr.lbl = dShort(v); save(); toast('Дата инвентаризации: ' + dShort(v)); }); },
};

/* ---------- действия v18 ---------- */
Object.assign(A, {
  pview: d => { R.pv = d.v; render(); },
  pwhf: d => { R.wh = d.v; render(); },
  pwh: d => { const w = S.wip; if (!w) return; w.wh = w.wh === d.v ? '' : d.v; if (w.view) w.view = false; w.dirty = true; save(); render(); },
  pcancel: () => { const w = S.wip; if (!w) return;
    if (!w.docId){ if (!w.items.length){ S.wip = null; save(); return doBack(); } return confirmBox(`Отменить новый ${isRet(w.type) ? 'возврат' : 'приход'}? ${w.items.length} поз. пропадут.`, 'Отменить', () => { S.wip = null; save(); doBack(); }); }
    const go2 = () => { A.popen({v:w.docId}); toast('Изменения отменены'); }; if (w.dirty) return confirmBox('Отменить изменения? Документ останется как был.', 'Отменить изменения', () => { w.dirty = false; go2(); }); go2(); },
  perq: d => { setPer(d.v); render(); },
  pershift: d => { const s = +d.v;
    if (R.s === 'rost' || R.s === 'rcashbal'){ R.date = addD(R.date || TODAY, s); if (R.date > TODAY) R.date = TODAY; return render(); }
    const n = daysIn(R.from, R.to); let f = addD(R.from, s * n), t = addD(R.to, s * n); if (t > TODAY){ t = TODAY; f = addD(t, -(n - 1)); } R.from = f; R.to = t; R.date = t; render(); },
  xlsx: () => exportScreen(),
  print: () => { window.print(); },
  reloadnow: () => { flushAll(); location.reload(); },
  sgrp: d => { const c = ls.get('chorsu_sidegrp', {}); c[d.v] = !c[d.v]; ls.set('chorsu_sidegrp', c); renderSide(); },
  mgrp: d => { const c = ls.get('chorsu_menugrp', {ref:1}); c[d.v] = !c[d.v]; ls.set('chorsu_menugrp', c); render(); },
  mvkassa: d => { MV.kassa = d.v; const s = document.getElementById('npsub'); if (s && NP && NP.subFn) s.innerHTML = NP.subFn(); },
  // касса
  ctab: d => { R.ct = d.v; render(); },
  ckf: d => { R.kf = d.v; render(); },
  cbysale: () => { R.bySale = !R.bySale; render(); },
  cnew: d => { const dir = d.v === 'out' ? 'out' : 'in', kind = dir === 'in' ? 'sale' : 'term'; R.cerr = ''; R.cd = {date:R.to && R.to <= TODAY ? R.to : TODAY, dir, kind, kassa:CKIND[kind].kassa || 'cash', amt:0, note:''}; R.cedit = true; R.csel = null; if (!DESK || R.s !== 'cash') go('cdoc', {cd:R.cd, cedit:true}); else render(); },
  csel: d => { const c = cdocById(d.v); if (!c) return; keepCd();
    if (R.cd && (R.cedit || !R.cd.id) && R.cd.amt && R.cd.id !== c.id && !d.force) return askSave(() => { saveCdoc(); }, () => { R.cd = null; R.cedit = false; A.csel({v:d.v, force:1}); }); R.csel = c.id; R.cd = Object.assign({}, c); R.cedit = false; R.cerr = ''; if (!DESK || R.s !== 'cash') go('cdoc', {cd:R.cd, cedit:false}); else render(); },
  cedit: () => { if (R.cd){ R.cedit = true; render(); } },
  cdir: d => { keepCd(); const c = R.cd; c.dir = d.v; if (CKIND[c.kind].dir !== c.dir){ c.kind = c.dir === 'in' ? 'sale' : 'term'; c.kassa = CKIND[c.kind].kassa || c.kassa; } render(); },
  ckind: d => { keepCd(); R.cd.kind = d.v; if (CKIND[d.v].kassa) R.cd.kassa = CKIND[d.v].kassa; R.cerr = ''; render(); },
  ckassa: d => { keepCd(); R.cd.kassa = d.v; render(); },
  camt: () => { keepCd(); openNP({title:cashName(R.cd) + ' · ' + KASSA[R.cd.kassa], sub:dLong(R.cd.date), money:true, val:R.cd.amt ? String(R.cd.amt) : '', ok:'Готово', onOk:n => { R.cd.amt = n; R.cerr = ''; NP = null; render(); }}); },
  csave: () => { if (R.cd && (R.cedit || !R.cd.id)) saveCdoc(); },
  ccancel: () => { const c = R.cd; if (!c) return; if (!c.id){ R.cd = null; if (R.s === 'cdoc') return doBack(); return render(); } R.cd = Object.assign({}, cdocById(c.id)); R.cedit = false; R.cerr = ''; render(); },
  cdel: () => { const c = R.cd && cdocById(R.cd.id); if (!c) return; if (c.legacy && SRV_V < 18) return toast('Сначала обновите Code.gs до v18'); const what = `${c.dir === 'in' ? 'Приход' : 'Расход'}: ${cashName(c)} · ${KASSA[c.kassa]} · ${dShort(c.date)} · ${fmt(c.amt)}`;
    const del = () => { logAct('Удалён', 'Касса', c.id, c.date, '', what, c.dir === 'in' ? c.amt : -c.amt, {cd:Object.assign({}, c)});
      if (c.legacy) S.cash[c.date] = Object.assign({t:0, k:0}, S.cash[c.date], {[c.legacy]:0}); else S.cashdocs = S.cashdocs.filter(x => x.id !== c.id);
      save(); R.cd = null; R.csel = null; if (R.s === 'cdoc') doBack(); else render(); toast('Документ кассы удалён'); };
    confirmBox('Удалить документ кассы?<br><b>' + what + '</b>', 'Удалить', () => c.date === TODAY ? del() : setTimeout(() => pinGuard(what, del), 0)); },
  cday: d => { const [day, k] = d.v.split('|'), list = allCashDocs().filter(c => c.date === day && c.kind === k);
    if (list.length === 1) return A.csel({v:list[0].id});
    if (!list.length){ R.cd = {date:day, dir:CKIND[k].dir, kind:k, kassa:CKIND[k].kassa || 'cash', amt:0, note:''}; R.cedit = true; R.cerr = ''; R.ct = 'docs'; if (!DESK) return go('cdoc', {cd:R.cd, cedit:true}); return render(); }
    R.from = R.to = day; R.ct = 'docs'; render(); },
  cauto: d => { const [src, ref] = d.v.split('|');
    if (src === 'cdoc'){ if (R.s === 'cash') return A.csel({v:ref}); return go('cash', {from:(cdocById(ref) || {}).date, to:(cdocById(ref) || {}).date, csel:ref}); }
    if (src === 'sale') return go('possale', {id:ref}); if (src === 'posday') return go('rpos', {date:ref}); if (src === 'move') return go('debtor', {id:ref}); },
  cash0: () => { const c0 = cash0(); CONF = null;
    openNP({title:'Начальный остаток: наличные', sub:`На утро ${dLong(c0.date)}. Сколько наличных было в кассе.`, money:true, allowZero:true, val:c0.cash ? String(c0.cash) : '', ok:'Дальше', onOk:n1 => {
      openNP({title:'Начальный остаток: карта', sub:`На утро ${dLong(c0.date)}.`, money:true, allowZero:true, val:c0.card ? String(c0.card) : '', ok:'Сохранить', onOk:n2 => { NP = null; logAct('Изменён', 'Настройки', 'cash0', c0.date, '', `Начальный остаток кассы на ${dShort(c0.date)}: нал ${fmt(n1)}, карта ${fmt(n2)}`, n1 + n2); S.cash0 = {date:c0.date, cash:n1, card:n2}; save(); toast('Сохранено'); }}); }}); },
  cash0date: () => { DSHEET = {act:'cash0d', v:cash0().date, title:'С какого дня вести остаток кассы'}; ANIM = true; render(); },
  pterm: d => { const z = dayTotals(d.v), c = cashOf(d.v), set = () => { setTermDay(d.v, z.cardAll); toast('Терминал за ' + dShort(d.v) + ': ' + fmt(z.cardAll)); };
    if (c.t && c.t !== z.cardAll) CONF = {text:`Заменить терминал за ${dShort(d.v)}?<br><b>было ${fmt(c.t)} → станет ${fmt(z.cardAll)}</b>`, yes:{l:'Заменить', c:'pri', f:set}, no:{l:'Нет', f:() => {}}}; else set(); render(); },
  // отчёты
  rtprod: d => go('rturnp', {id:d.v, from:R.s === 'rost' ? addD(R.date || TODAY, -13) : R.from, to:R.s === 'rost' ? R.date || TODAY : R.to}),
  rcpopen: d => go('rcpd', {id:d.v, from:R.from, to:R.to}),
  jtab: d => { R.jt = d.v; render(); },
  jidx: () => { R.jid = null; render(); },
  jf: d => { R.jf = d.v; render(); },
  jopen: d => { const [a, id] = d.v.split('|'); if (a === 'docgo') return A.docgo({v:id}); if (a === 'cauto') return A.cauto({v:'cdoc|' + id}); if (a === 'rweek') return go('rweek', {id}); if (a === 'dopen') return go('debtor', {id}); if (a === 'rbal') return go('rbal'); if (a === 'possale') return go('possale', {id}); },
  jdoc: d => go('rjournal', {jt:'acts', q:'', from:addD(TODAY, -365), to:TODAY, jid:d.v}),
  jrestore: d => { const x = S.actlog.find(y => y.id === d.v); if (!x) return; confirmBox(`Восстановить из журнала?<br><b>${esc(x.doc)}: ${esc(x.desc)}</b>`, 'Восстановить', () => restoreFromLog(d.v)); },
  // резервные копии
  snapdl: async d => { try { const s = await IDB.get(d.v); if (!s) return toast('Снимок не найден'); dlJson(s, `Chorsu снимок ${d.v.slice(5)}.json`); } catch(e){ toast('Не получилось прочитать снимок'); } },
  dbjson: () => { dlJson({ts:Date.now(), rev:DB.rev, t:DB.t, s:SDB, loc:{drafts:LOC.drafts, wip:LOC.wip, pos:LOC.pos}, out:OUT}, `Chorsu база ${TODAY}.json`); },
  outdl: () => dlJson({ts:Date.now(), out:OUT, rej:REJ}, `Chorsu очередь ${TODAY}.json`),
  dbxls: async () => { toast('Готовлю файл…'); try { await loadXLSX(); } catch(e){ return toast('Нет интернета — файл сделать нельзя'); }
    const wb = XLSX.utils.book_new(), all = Object.assign({}, DB.t, SDB);
    Object.keys(all).forEach(k => { const rows = Object.values(all[k] || {}); if (!rows.length) return; XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), (TBL_RU[k] || k).slice(0, 30)); });
    dlBlob(new Blob([XLSX.write(wb, {bookType:'xlsx', type:'array'})], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), `Chorsu база ${TODAY}.xlsx`); toast('Файл Excel скачан'); },
  draftrest: d => { const x = (S.draftbk || []).find(y => y.id === d.v); if (!x) return; let data; try { data = JSON.parse(x.data); } catch(e){ return toast('Черновик повреждён'); }
    const put = () => { if (x.kind === 'inv-cig') S.drafts.cig = data; else if (x.kind === 'inv-goods') S.drafts.goods = data; else if (x.kind === 'prihod') S.wip = Object.assign(data, {dirty:true}); else if (x.kind === 'pos'){ LOC.pos.cur = data; posKeep(); }
      save(); draftPushNow(); logAct('Восстановлен', 'Черновик', x.id, x.date, '', `${DKIND[x.kind] || x.kind} с устройства ${x.dev}`, 0); toast('Черновик восстановлен на это устройство'); render(); };
    const has = x.kind === 'inv-cig' ? S.drafts.cig : x.kind === 'inv-goods' ? S.drafts.goods : x.kind === 'prihod' ? S.wip : (LOC.pos.cur && LOC.pos.cur.lines.length);
    confirmBox(`Восстановить «${DKIND[x.kind] || x.kind}» с устройства ${esc(x.dev)} (${fmtTs(x.upd)})?${has ? '<br><b>На этом устройстве уже есть такой незаконченный документ — он заменится.</b>' : ''}`, 'Восстановить', put); },
});
DATE_ACT.cash0d = v => { const c0 = cash0(); logAct('Изменён', 'Настройки', 'cash0', v, '', 'Остаток кассы ведётся с ' + dShort(v), 0); S.cash0 = {date:v, cash:c0.cash, card:c0.card}; save(); render(); };
// черновики уходят в базу через 20 с после изменения (и сразу при сворачивании программы)
{ const save0 = save; save = function(){ save0(); draftSoon(); }; }

document.addEventListener('change', e => {   // период в панели отчётов и документов
  const el = e.target; if (el.dataset.in !== 'per' || !el.value) return;
  const v = el.value > TODAY ? TODAY : el.value, k = el.dataset.k;
  if (k === 'date'){ R.date = v; return render(); }
  R[k] = v; if (R.from > R.to){ if (k === 'from') R.to = R.from; else R.from = R.to; } R.date = R.to; render();
});
document.addEventListener('keydown', e => {   // Ctrl+E — изменить, Ctrl+D — удалить (как в Logix)
  if (!(e.ctrlKey || e.metaKey) || e.altKey || NP || CONF || !DB) return; const k = e.key.toLowerCase();
  if (k === 'e' || k === 'у'){ const a = R.s === 'pdoc' ? 'pedit' : (R.s === 'cash' || R.s === 'cdoc') && R.cd && R.cd.id ? 'cedit' : null; if (a){ e.preventDefault(); A[a]({}); } }
  if (k === 'd' || k === 'в'){ const a = R.s === 'pdoc' ? 'pdocdel' : (R.s === 'cash' || R.s === 'cdoc') && R.cd && R.cd.id ? 'cdel' : R.s === 'plist' && R.sel ? 'pdocdel' : null; if (a){ e.preventDefault(); A[a](R.s === 'plist' ? {v:R.sel} : {}); } }
}, true);

/* устройство-касса: сразу открыть продажу (и после первой загрузки базы, и после входа) */
function startScreen(){ HIST.length = 0; if (POSDEV().on){ HIST.push({s:'home'}); R = {s:'pos'}; } else R = {s:'home'}; }
if (POSDEV().on && R.s === 'home') startScreen();

/* Кнопка и жест «Назад» телефона: каждый экран и окно — шаг в истории браузера, чтобы «назад» не закрывало приложение */
let HSKIP = 0;
function syncHist(){
  if (HSKIP || !CFG || !DB) return;
  const want = HIST.length + (NP || CONF || TSHEET || DSHEET || MSHEET ? 1 : 0) + (R.sOpen || R.q ? 1 : 0);
  const have = (history.state && history.state.chorsu) || 0;
  try {
    if (want > have){ for (let i = have + 1; i <= want; i++) history.pushState({chorsu:i}, ''); }
    else if (want < have){ HSKIP++; history.go(want - have); }
  } catch(e){}
}
window.addEventListener('popstate', () => {
  if (HSKIP){ HSKIP--; syncHist(); return; }
  if (NP){ NP = null; render(); }
  else if (CONF){ CONF = null; render(); }
  else if (TSHEET){ TSHEET = false; render(); }
  else if (DSHEET){ DSHEET = null; render(); }
  else if (MSHEET){ MSHEET = false; render(); }
  else if (R.s === 'pos' && (POS.pay || POS.ov || POS.chg)){ POS.pay = null; POS.ov = null; POS.chg = null; render(); }
  else if (R.s === 'pos' && POSDEV().on){ render(); }
  else if (R.sOpen || R.q || HIST.length) back();
  syncHist();
});
try { if (!history.state || history.state.chorsu == null) history.replaceState({chorsu:0}, ''); } catch(e){}
// boot: the splash waits for this first update of the base
window.splashResult = () => {
  if (!CFG) return '';
  if (!DB) return LOADERR ? 'Не удалось загрузить базу' : '';
  if (SYNC.state === 'offline') return 'Нет интернета — открываю сохранённые данные';
  if (SYNC.state === 'key') return 'Нужна новая ссылка подключения';
  if (SYNC.state === 'err') return 'База не отвечает — открываю сохранённые данные';
  return '✓ База обновлена';
};
if (location.hash.includes('connect=')) tryConnect(location.hash);
else if (CFG && !DB){ render(); window.splashHold = loadLocal().then(x => { if (x && !DB){ DB = x.d; SDB = x.s; if (x.all){ PERS.all = true; schedulePersist(); } OUT.forEach(applyOut);
  S = Object.assign(fromTables(), {drafts:S.drafts, wip:S.wip}); DATAV++; render(); return sync(); } return firstLoad(); }).catch(() => firstLoad()); }
else { render(); window.splashHold = CFG ? sync() : null; }
if (window.splashHold === undefined) window.splashHold = null;
if ('serviceWorker' in navigator){ const had = !!navigator.serviceWorker.controller; navigator.serviceWorker.register('sw.js').then(r => { try { r.update(); } catch(e){} }).catch(() => {});
  let reloaded = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (!had || reloaded) return; if (safeToReload()){ reloaded = true; flushAll(); location.reload(); } else { NEW_VER = true; paintBanners(); } }); }   // вышла новая версия — открыть её, когда ничего не вводится (v18)
window.addEventListener('hashchange', () => { if (location.hash.includes('connect=')) tryConnect(location.hash); });
</script>
