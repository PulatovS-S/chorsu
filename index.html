<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D5C45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Магазин Чорсу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one-column phone app; sticky header; actions live in floating circles bottom-right (thumb zone) */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --sunk:#E3E9E4; --ink:#16201B; --muted:#56645D; --faint:#7A8780; --line:#D3DCD5;
  --accent:#1D5C45; --accent-ink:#FFFFFF; --accent-soft:#DCEBE3;
  --kkm:#2353A3; --kkm-soft:#E1E9F7; --om:#94570F; --om-soft:#F6EAD9; --own:#4B3D69; --own-soft:#E9E4F2; --goods:#16706F; --goods-soft:#DDF0EF; --coral:#C4462E;
  --bad:#BE2E26; --bad-soft:#FBE6E3; --good:#227046; --good-soft:#DFF1E6; --warn:#8A5A00; --warn-soft:#FFF1D2;
  --shadow:rgba(10,30,20,.28);
  --f:"Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101613; --surface:#18211D; --sunk:#202B26; --ink:#EDF2EE; --muted:#A2B0A8; --faint:#6F7D76; --line:#2D3833;
  --accent:#5DBE93; --accent-ink:#0C1A13; --accent-soft:#1E3A2E;
  --kkm:#86AEF0; --kkm-soft:#1C2A44; --om:#E2A75A; --om-soft:#3A2A16; --own:#B9AADF; --own-soft:#2B2540; --goods:#62C9C7; --goods-soft:#163634;
  --bad:#FF8076; --bad-soft:#3D1D1A; --good:#6FD39A; --good-soft:#173524; --warn:#F0C25E; --warn-soft:#3A2E12; --shadow:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#18211D; --sunk:#202B26; --ink:#EDF2EE; --muted:#A2B0A8; --faint:#6F7D76; --line:#2D3833;
  --accent:#5DBE93; --accent-ink:#0C1A13; --accent-soft:#1E3A2E;
  --kkm:#86AEF0; --kkm-soft:#1C2A44; --om:#E2A75A; --om-soft:#3A2A16; --own:#B9AADF; --own-soft:#2B2540; --goods:#62C9C7; --goods-soft:#163634;
  --bad:#FF8076; --bad-soft:#3D1D1A; --good:#6FD39A; --good-soft:#173524; --warn:#F0C25E; --warn-soft:#3A2E12; --shadow:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:18px;line-height:1.35;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:210px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink)}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px}
.hrow{display:flex;align-items:center;gap:10px;min-height:52px}
.hdr h1{font-size:22px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsum-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;column-gap:12px;padding-top:6px}
.hsum-row h1{flex:0 1 auto;font-size:26px;white-space:normal}
.hsum{font-size:32px;font-weight:700;letter-spacing:-.5px;white-space:nowrap;margin-left:auto}
.back{min-height:48px;padding:0 14px 0 8px;border-radius:12px;background:var(--sunk);font-weight:600;font-size:18px;flex:none}
.syncbar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;font-size:15px;padding-block:10px;min-height:48px;background:var(--good-soft);color:var(--good)}
.syncbar b{white-space:nowrap;text-decoration:underline}
.syncbar.warn{background:var(--warn-soft);color:var(--warn)}.syncbar.bad{background:var(--bad-soft);color:var(--bad)}.syncbar.busy{background:var(--sunk);color:var(--muted)}
.demo{font-size:15px;color:var(--warn);background:var(--warn-soft);padding-block:8px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.demo button{font-size:15px;text-decoration:underline;color:var(--warn);padding:0 8px;min-height:44px;min-width:44px}
.stack{display:flex;flex-direction:column;gap:12px;padding-block:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:15px}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.lbl{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.home-date{font-size:26px;font-weight:700;margin:4px 0 0}
.tile{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-height:84px}
.tile .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none}
.tile .ic svg{width:28px;height:28px}
.tile b{display:block;font-size:22px;color:var(--ink)}
.tile span{font-size:15px;color:var(--muted)}
.tile .chev{margin-left:auto;color:var(--muted);font-size:26px}
.tile:active{background:var(--sunk)}
.datenav{display:flex;align-items:center;gap:8px}
.datenav .d{flex:1;text-align:center;font-weight:700;font-size:19px;min-height:52px;display:flex;flex-direction:column;justify-content:center;border-radius:12px}
.datenav .d:active{background:var(--sunk)}
.datenav button{width:56px;height:52px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:700}
.datenav button:disabled{opacity:.35}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sunk);padding:5px;border-radius:16px}
.seg button{min-height:56px;border-radius:12px;font-weight:700;font-size:17px;color:var(--muted);padding:4px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 0}
.sumrow + .sumrow{border-top:1px dashed var(--line)}
.sumrow b{font-size:20px}
.pill{display:inline-block;font-size:15px;font-weight:700;padding:3px 10px;border-radius:99px;vertical-align:middle}
.p-kkm{background:var(--kkm-soft);color:var(--kkm)}.p-om{background:var(--om-soft);color:var(--om)}.p-own{background:var(--own-soft);color:var(--own)}.p-g{background:var(--goods-soft);color:var(--goods)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:62px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:var(--sunk)}
.num{min-width:40px;font-size:15px;color:var(--muted);font-weight:600}
.row .nm{flex:1;min-width:0;font-size:18px}
.row .rt{font-weight:700;white-space:nowrap;font-size:19px}
.badge{font-weight:700;font-size:16px;padding:4px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.x{width:44px;height:44px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:20px;font-weight:700;flex:none}
.btn{min-height:60px;border-radius:14px;font-weight:700;font-size:19px;padding:0 18px;width:100%}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:2px solid var(--line)}
.btn.give{background:var(--om);color:#fff}
.btn.ret{background:var(--good);color:#fff}
.btn.dang{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:15px;font-weight:600;color:var(--muted)}
.field input,.field select{min-height:60px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:0 14px;font-size:24px;font-weight:700;width:100%;min-width:0}
.field input:focus{border-color:var(--accent);outline:none}
.field.txt input,.field.txt select{font-size:19px;font-weight:500}
/* inventory cells */
.cell{display:flex;flex-direction:column;gap:4px}
.cell label{font-size:16px;font-weight:700}
.cell .box{position:relative}
.cell input{width:100%;min-width:0;height:84px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 14px 18px;font-size:38px;font-weight:700;letter-spacing:-.5px}
.cell input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cell .was{position:absolute;right:12px;bottom:6px;font-size:15px;color:var(--faint);pointer-events:none;font-weight:500}
.cell.kkm label{color:var(--kkm)}.cell.om label{color:var(--om)}.cell.own label{color:var(--own)}.cell.ret label{color:var(--muted)}
.cell.kkm input{border-color:color-mix(in srgb,var(--kkm) 30%,var(--line))}
.cell.om input{border-color:color-mix(in srgb,var(--om) 30%,var(--line))}
.cell.own input{border-color:color-mix(in srgb,var(--own) 30%,var(--line))}
.money{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:84px;padding:12px 16px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);text-align:left}
.money b{font-size:28px}
.money.dirty{border-color:var(--warn)}
.note{border-radius:12px;padding:12px 14px;font-size:16px}
.note.info{background:var(--sunk);color:var(--ink)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.neg{color:var(--bad)!important;font-weight:700}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:10px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th+th,td+td{border-left:1px solid var(--line)}
tr.rowtap{cursor:pointer}tr.rowtap:active td{background:var(--sunk)}
table.wide td.stick,table.wide th.stick{position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
table.wide th.stick{background:var(--sunk)}
table.wide td.z{color:var(--faint)}
.datebtn{position:relative;display:flex;align-items:center;gap:6px;min-height:48px;padding:0 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:16px;white-space:nowrap;flex:none;margin-left:auto}
.datebtn svg{width:20px;height:20px}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 6px}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{font-size:15px;font-weight:600;min-height:22px;padding:0 6px 6px}
.range{display:grid;grid-template-columns:1fr 1fr;gap:10px}.range .field{min-width:0}.range input{width:100%;min-width:0;font-size:17px;padding-left:10px;padding-right:6px}
th{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--sunk)}
td.l,th.l{text-align:left}
td.nmc{white-space:normal;text-align:left;width:100%;min-width:120px;overflow-wrap:break-word;line-height:1.25}
td.nmc .sm{font-size:15px;color:var(--muted);margin-top:2px}
td.nmc .n{color:var(--muted);font-size:15px;margin-right:4px}
table.tight th,table.tight td{padding:9px 6px}
table.tight td:first-child,table.tight th:first-child{padding-left:10px}
tr.tot td{font-weight:700;background:var(--sunk)}
table.tight th{font-size:13px;letter-spacing:.02em;white-space:normal;line-height:1.15;vertical-align:bottom}
table.wide th{white-space:nowrap}
table.doc td{padding:10px 6px}table.doc td.nmc{min-width:104px}
.srow{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow.negrow{background:var(--bad-soft)}
.srow .sold{font-weight:700;font-size:20px;text-align:right}
.srow .sub{font-size:15px;color:var(--muted)}
.detail{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.detail .sumrow b{font-size:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:8px}
.g4 div{min-width:0}.g4 span{display:block;font-size:15px;color:var(--muted)}.g4 b{font-size:clamp(17px,4.8vw,20px);white-space:nowrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:clamp(18px,5.2vw,22px);margin-top:2px;white-space:nowrap}
.stat.badst{background:var(--bad-soft);border-color:transparent}.stat.badst b,.stat.badst .lbl{color:var(--bad)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;min-height:46px;padding:0 16px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:16px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.pname{font-size:38px;font-weight:700;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.3px}
.bal{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:12px;padding:10px 14px;background:var(--sunk)}
.bal b{font-size:26px}
.bal .small{color:var(--muted)}
.bal.badlive{background:var(--bad-soft)}.bal.badlive b,.bal.badlive span{color:var(--bad)}
.hint{font-size:15px;color:var(--own);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:20px}
.hint button{background:var(--own-soft);color:var(--own);border-radius:8px;padding:0 12px;min-height:44px;font-weight:700;font-size:15px}
.sec-h{font-size:15px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 -4px}
.empty-st{padding:22px;text-align:center;color:var(--muted)}
.doc-ic{width:70px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:700;font-size:15px}
/* floating actions */
.fabs{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px;z-index:8}
.fabs.up{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
body.kb .fabs{display:none}
.fab{width:70px;height:70px;border-radius:50%;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px var(--shadow);display:grid;place-items:center}
.fab svg{width:32px;height:32px}
.fab.s{width:60px;height:60px;background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.fab.s svg{width:28px;height:28px}
.fab.dirty{box-shadow:0 0 0 5px var(--warn-soft),0 6px 18px var(--shadow)}
.fab:active{transform:scale(.95)}
.fabw{display:flex;flex-direction:column;align-items:center;gap:4px}
.fab-cap{font-size:15px;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:1px 8px;border-radius:8px;white-space:nowrap}
.banner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:14px 16px;font-weight:700;font-size:17px}
.banner b{margin-left:auto;white-space:nowrap}
.dpick{position:relative}
.dpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.amt-pos{color:var(--om)}.amt-neg{color:var(--good)}
.rowtap{cursor:pointer}
.botbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.botbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 74px 1.4fr;gap:10px}
.botbar .btn{padding:0 8px;white-space:nowrap}
.botbar .sbtn{border-radius:14px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px}.botbar .sbtn svg{width:24px;height:24px}
/* search bar */
.sbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 69px);z-index:4;background:var(--bg);padding-block:10px;display:flex;gap:8px}
.sbar input{flex:1;min-width:0;min-height:56px;border-radius:14px;border:2px solid var(--accent);background:var(--surface);padding:0 16px;font-size:20px}
.sbar input:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.sbar button{width:56px;border-radius:14px;background:var(--sunk);font-size:22px;font-weight:700}
.hdr.tall + .sbar{top:calc(env(safe-area-inset-top,0px) + 128px)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;max-height:92%;overflow:auto}
.sheet h2{margin:0;font-size:22px;line-height:1.2}
.disp{background:var(--sunk);border-radius:14px;padding:0 16px;text-align:right;font-size:44px;font-weight:700;height:72px;line-height:72px;letter-spacing:-.5px;overflow:hidden;white-space:nowrap}
.disp.empty{color:var(--muted);font-weight:500}
.npx{font-size:15px;color:var(--muted);text-align:right;height:20px;line-height:20px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:62px;border-radius:14px;background:var(--sunk);font-size:28px;font-weight:600;touch-action:manipulation}
.keys button:active{background:var(--line)}
.sheet-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.typebtn{display:flex;align-items:center;gap:14px;min-height:72px;border-radius:16px;padding:0 18px;font-size:21px;font-weight:700;text-align:left;width:100%}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:700;z-index:30;font-size:18px;max-width:calc(100% - 130px)}
.botbar ~ .toast{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.ov.anim .sheet{animation:up .18s ease-out}
@media (prefers-reduced-motion:reduce){.ov.anim .sheet{animation:none}}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
</style>

</head>
<body>
<div id="splash" aria-hidden="true"><svg id="splashSvg" viewBox="190 240 620 520" preserveAspectRatio="xMidYMid meet"></svg></div>
<style>
#splash{position:fixed;inset:0;z-index:100;background:#1D5C45;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease}
#splash svg{width:100%;height:100%;max-width:640px}
#splash.out{opacity:0;pointer-events:none}
</style>
<script>
/* Заставка «Магазин Чорсу» — плоская 2D-векторная анимация.
   Детерминированный таймлайн: render(t) рисует кадр для времени t (секунды).

async function api(method, payload){
  if (method === 'GET'){
    const q = Object.keys(payload).map(k => k + '=' + encodeURIComponent(payload[k])).join('&');
    const r = await fetch(CFG.u + (CFG.u.includes('?') ? '&' : '?') + q, {redirect:'follow'});
    return r.json();
  }
  const r = await fetch(CFG.u, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)});
  return r.json();
}
async function push(){
  while (OUT.length){
    const batch = OUT.slice(0, 400), sent = new Set(batch.map(o => o.s));
    const j = await api('POST', {key:CFG.k, action:'push', ops:batch.map(o => o.del ? {t:o.t, id:o.id, del:1} : {t:o.t, id:o.id, row:o.row})});
    if (!j || !j.ok) throw new Error(j && j.error === 'key' ? 'key' : (j && j.error) || 'push');
    OUT = OUT.filter(o => !sent.has(o.s)); ls.set(OUT_KEY, OUT);
  }
}
async function pull(full){
  const since = (full || !DB) ? -1 : DB.rev;
  const j = await api('GET', {key:CFG.k, action:'pull', since});
  if (!j || !j.ok) throw new Error(j && j.error === 'key' ? 'key' : (j && j.error) || 'pull');
  if (since !== -1 && Number(j.rev) < since) return pull(true);   // база на сервере пересоздана — загрузить заново целиком
  if (since === -1){ DB = {rev:0, t:{}}; TABLES.forEach(k => DB.t[k] = {}); }
  let changed = since === -1;
  for (const k in j.tables){
    DB.t[k] = DB.t[k] || {};
    j.tables[k].forEach(row => { const id = Sx(row[0]); changed = true;
      if (row[row.length - 1] === 'x') delete DB.t[k][id]; else DB.t[k][id] = row.slice(0, row.length - 2); });
  }
  OUT.forEach(o => { DB.t[o.t] = DB.t[o.t] || {}; if (o.del) delete DB.t[o.t][o.id]; else DB.t[o.t][o.id] = o.row; }); // my unsent changes win
  DB.rev = j.rev; persistDB();
  return changed;
}
function sync(full){
  if (!CFG) return Promise.resolve();

  SYNC.state = 'busy'; paintStatus();
  syncing = (async () => {
    try {
      await push();

      SYNC.state = 'ok'; SYNC.err = ''; SYNC.last = Date.now(); ls.set('chorsu_last', SYNC.last);
      if (changed){ S = Object.assign(fromTables(), {drafts:S.drafts, wip:S.wip}); softRender(); }
    } catch(e){

    } finally { syncing = null; paintStatus(); }
  })();

}

  if (n) return ['warn', `${n} ${n===1?'запись ждёт':'записей ждут'} отправки`];

function prodRows(cat, q, right, act){
  const ql = q.trim().toLowerCase();
  const items = ordered(cat).map((p,i) => ({p, n:i+1})).filter(({p,n}) => !ql || String(n) === ql || match(p.name, ql));
  if (!items.length) return `<div class="empty-st">Ничего не найдено</div>`;
  return items.map(({p,n}) => `<button class="row" data-a="${act}" data-v="${p.id}"><span class="num">${n}</span><span class="nm">${esc(p.name)}</span>${right(p.id)}</button>`).join('');
}
function savePdoc(){
  const w = S.wip; if (!w) return;
  if (!w.items.length && !w.docId){ S.wip = null; save(); doBack(); return toast('Пустой приход не сохранён'); }
  let doc = w.docId && S.docs.find(d => d.id === w.docId);
  if (!doc){ doc = {id:uid(), date:w.date, type:w.type, ts:Date.now()}; S.docs.push(doc); }
  S.prihod = S.prihod.filter(x => x.doc !== doc.id);
  w.items.forEach(x => S.prihod.push({id:uid(), doc:doc.id, date:doc.date, pid:x.pid, type:doc.type, qty:x.qty}));
  if (!w.items.length) S.docs = S.docs.filter(d => d.id !== doc.id);
  const one = isRet(doc.type) ? 'Возврат' : 'Приход';
  S.wip = null; save(); doBack(); toast(one + ' сохранён');
}

V.icard = () => {
  const cat = 'cig', dr = S.drafts.cig; if (!dr) return V.inv();

  return `<div class="hdr wrap"><div class="hrow"><button class="back" data-a="back">‹ Выйти</button><h1>№ ${dr.idx+1} из ${items.length}</h1><span class="small muted">${dr.lbl||''}</span></div><div class="prog" style="margin-top:6px"><i style="width:${pct}%"></i></div></div>
  <div class="wrap stack">
    <p class="pname">${esc(p.name)}</p>
    <div class="grid2">${cell(0,'kkm','ККМ блок')}${cell(1,'kkm','ККМ дона')}${cell(2,'om','Омбор блок')}${cell(3,'om','Омбор дона')}${cell(4,'own','Чёрный')}${cell(5,'ret','Возврат')}</div>
    <div class="hint" id="bhint">${dr.sugs && dr.sugs[p.id] ? `Чёрный подставлен: было ${a[4]||0} + куплено ${pr.own}. Исправьте, если не так.` : (sug>0 && row[4]!==sug ? `Ожидается чёрный: ${sug} <button data-a="isug" data-v="${sug}">Подставить</button>` : '')}</div>

};

    if (i % labEvery === 0 || i === n - 1) g += `<text x="${Math.min(W - 30, Math.max(padL + 24, x + w/2))}" y="${H - 10}" text-anchor="middle" font-size="21" fill="var(--muted)">${esc(p.lbl)}</text>`; });

/* ---------- numpad (updates in place — no re-render on key press) ---------- */
function openNP(o){ NP = Object.assign({val:''}, o); NP.fresh = !!NP.val; TOAST = null; ANIM = true; render(); }
const qtyWarn = n => n >= 1000 ? ' · ⚠ Проверьте: очень большое количество' : '';
function npDisp(){ const v = NP.val, n = Number(v||0); return v ? (NP.mask ? '•'.repeat(v.length) : fmt(n)) : (NP.money ? '0 сум' : '0'); }
function npHtml(){
  const n = Number(NP.val||0);
  return `<div class="ov ${ANIM?'anim':''}"><div class="sheet" role="dialog" aria-label="${esc(NP.title)}">
    <h2>${esc(NP.title)}</h2>${NP.sub ? `<div class="muted small" id="npsub">${NP.sub}</div>` : ''}
    <div class="disp ${NP.val?'':'empty'}" id="npdisp">${npDisp()}</div>
    <div class="npx" id="npx">${NP.extra ? NP.extra(n) : ''}</div>
    <div class="keys">${['1','2','3','4','5','6','7','8','9', NP.money?'000':'00','0','⌫'].map(k => `<button data-a="npk" data-v="${k}">${k}</button>`).join('')}</div>
    <div class="sheet-btns"><button class="btn sec" data-a="npclose">Отмена</button><button class="btn pri" id="npok" data-a="npok" ${NP.allowZero || n>0 ? '' : 'disabled'}>${NP.ok || 'Записать'}</button></div>
    ${NP.onDel ? `<button class="btn dang" data-a="npdel">${NP.delL || 'Удалить строку'}</button>` : ''}
  </div></div>`;
}
function npUpdate(){
  const n = Number(NP.val||0), d = document.getElementById('npdisp');
  d.textContent = npDisp(); d.classList.toggle('empty', !NP.val);
  if (NP.extra) document.getElementById('npx').textContent = NP.extra(n);
  document.getElementById('npok').disabled = !(NP.allowZero || n>0);
}
function confHtml(){ return `<div class="ov ${ANIM?'anim':''}"><div class="sheet" role="alertdialog"><h2>${CONF.text}</h2><div class="sheet-btns"><button class="btn sec" data-a="cfno">${CONF.no.l}</button><button class="btn ${CONF.yes.c}" data-a="cfyes">${CONF.yes.l}</button></div></div></div>`; }
function typeSheetHtml(){ const K = KIND[R.kind || 'in']; return `<div class="ov ${ANIM?'anim':''}" data-a="tsclose"><div class="sheet" data-stop="1"><h2>${K.q}</h2>
  ${K.keys.map(k => `<button class="typebtn p-${TYPES[k].c}" data-a="pnewt" data-v="${k}">${TYPES[k].full}</button>`).join('')}
  <button class="btn sec" data-a="tsclose">Отмена</button></div></div>`; }

  bdate: d => { R.date = addD(R.date, +d.v); render(); },
  pin: () => openNP({title:'ПИН-код', sub:'Введите 4 цифры', mask:true, allowZero:true, ok:'Войти', onOk:() => { if (NP.val === S.pin){ UNLOCK = true; NP = null; render(); } else { NP.val = ''; npUpdate(); document.getElementById('npsub').innerHTML = '<span class="neg">Неверный ПИН, попробуйте ещё</span>'; } }}),
  sprod: d => go('sprod', {cat:d.v}),
  sadd: () => go('sedit', {cat:R.cat, id:null}),
  sedit: d => go('sedit', {cat:R.cat, id:d.v}),
  ssave: () => {
    const name = document.getElementById('e_name').value.trim(), cost = +document.getElementById('e_cost').value.replace(/\D/g,'') || 0, sale = +document.getElementById('e_sale').value.replace(/\D/g,'') || cost;
    if (!name) return toast('Введите название');
    if (!R.id){
      const after = document.getElementById('e_after').value, id = R.cat[0] + uid(), np = {id, name, cat:R.cat, hidden:false};
      const pos = after === '__top' ? S.products.findIndex(p => p.cat === R.cat) : S.products.findIndex(p => p.id === after) + 1;
      S.products.splice(Math.max(pos,0), 0, np); S.prices.push({pid:id, from:'2026-01-01', cost, sale}); save(); doBack(); toast('Товар добавлен под № ' + numOf(id));
    } else {
      const p = P(R.id); p.name = name; const c = curPrice(p.id);
      if (c.cost !== cost || c.sale !== sale){ const from = document.getElementById('e_from').value || TODAY; S.prices = S.prices.filter(x => !(x.pid===p.id && x.from===from)); S.prices.push({pid:p.id, from, cost, sale}); }
      save(); doBack(); toast('Сохранено');
    }
  },
  smove: d => { const p = P(R.id), list = ordered(p.cat), i = list.findIndex(x => x.id === p.id), j = i + +d.v; if (j<0 || j>=list.length) return;
    const ai = S.products.indexOf(p), bi = S.products.indexOf(list[j]); [S.products[ai], S.products[bi]] = [S.products[bi], S.products[ai]]; save(); toast('Теперь № ' + numOf(p.id)); },
  shide: () => { const p = P(R.id); p.hidden = !p.hidden; save(); doBack(); toast(p.hidden ? 'Товар скрыт' : 'Товар снова в списке'); },
  sbal: () => openNP({title:'Начальный долг на ' + dShort(S.bal0.date), money:true, allowZero:true, ok:'Сохранить', onOk:n => { S.bal0.amount = n; save(); NP = null; toast('Сохранено'); }}),
  npk: d => { const k = d.v; if (NP.fresh){ NP.fresh = false; if (k !== '⌫') NP.val = ''; } if (k === '⌫') NP.val = NP.val.slice(0,-1); else if (NP.val.length < 12) NP.val = NP.mask ? (NP.val + k).slice(0, 4) : (NP.val + k).replace(/^0+/, ''); npUpdate(); },
  npok: () => NP.onOk(Number(NP.val||0)),
  npclose: () => { NP = null; render(); },
  cfno: () => { const f = CONF.no.f; CONF = null; f(); render(); },
  cfyes: () => { const f = CONF.yes.f; CONF = null; f(); render(); }
};

document.addEventListener('click', e => {
  const hit = e.target.closest && e.target.closest('.hit');
  if (hit){ const tip = document.getElementById('ctip'); if (tip) tip.textContent = hit.dataset.tip; document.querySelectorAll('.hit.sel').forEach(x => { x.classList.remove('sel'); x.setAttribute('fill', 'transparent'); }); hit.classList.add('sel'); hit.setAttribute('fill', 'color-mix(in srgb, var(--accent) 10%, transparent)'); return; }
  if (NEED_RENDER && !NP && !CONF){ NEED_RENDER = false; }
  const el = e.target.closest('[data-a]');
  if (!el) return;
  if (el.classList.contains('ov') && e.target !== el) return; // tap inside a sheet, not on a button
  e.preventDefault(); if (el.disabled) return;
  const f = A[el.dataset.a]; if (f) f(el.dataset);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.in === 'pdr' && el.value){ R[el.dataset.k] = el.value > TODAY ? TODAY : el.value; if (R.from > R.to){ const x = R.from; R.from = R.to; R.to = x; } return render(); }
  if (el.dataset.in === 'date' && el.value){
    const v = el.value > TODAY ? TODAY : el.value;
    if (R.s === 'cash' && R.dirty) return askSave(() => { saveCash(); R.date = v; render(); }, () => { R.dirty = false; R.cd = null; R.date = v; render(); });
    R.date = v; render();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.in === 'q'){
    const was = !!(R.q||'').trim(); R.q = el.value; const box = document.getElementById('plist');
    if (was !== !!R.q.trim()) render();
    else if (box){ const tmp = document.createElement('div'); tmp.innerHTML = V[R.s](); const nb = tmp.querySelector('#plist'); if (nb) box.innerHTML = nb.innerHTML; else render(); }
    else render();
  } else if (el.dataset.in === 'inv'){
    const dr = S.drafts.cig, p = ordered('cig')[dr.idx], i = +el.dataset.i;
    el.value = el.value.replace(/\D/g,'');
    dr.rows[p.id][i] = el.value === '' ? null : +el.value;
    if (i === 4 && dr.sugs && dr.sugs[p.id]){ delete dr.sugs[p.id]; const h = document.getElementById('bhint'); if (h) h.textContent = ''; }
    save(); const lv = document.getElementById('live'); if (lv) lv.innerHTML = liveHtml(p.id);
  }
});
/* hide floating buttons while the phone keyboard is open */
const isText = el => el && (el.tagName === 'INPUT' && !['date','button','checkbox'].includes(el.type) || el.tagName === 'TEXTAREA');
document.addEventListener('focusin', e => { if (isText(e.target)) document.body.classList.add('kb'); });
document.addEventListener('focusout', e => { setTimeout(() => {
  if (!isText(document.activeElement)) document.body.classList.remove('kb');
  const q = document.getElementById('q');
  if (q && document.activeElement !== q && !q.value && R.sOpen){ R.sOpen = false; const bar = q.closest('.sbar'); if (bar) bar.remove(); }
}, 60); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.in === 'inv'){
    e.preventDefault(); const nx = document.getElementById('f' + (+e.target.dataset.i + 1));
    if (nx) nx.focus(); else e.target.blur();
  }
  if (e.key === 'Enter' && e.target.id === 'q') e.target.blur();
});

V.connect = () => `<div class="hdr wrap"><div class="hrow"><h1>Магазин Чорсу</h1></div></div><div class="wrap stack">
  <div class="card"><b style="font-size:20px">Подключение к базе</b><p class="muted" style="margin:8px 0 0">Откройте на этом телефоне ссылку подключения, которую прислал Саидало. Или вставьте её сюда:</p></div>
  <div class="field txt"><label for="cfg_link">Ссылка подключения</label><input id="cfg_link" autocomplete="off" placeholder="https://…#connect=…"></div>
  <button class="btn pri" data-a="connectgo">Подключить</button></div>`;
V.loading = () => `<div class="hdr wrap"><div class="hrow"><h1>Магазин Чорсу</h1></div></div><div class="wrap stack">
  ${LOADERR ? `<div class="note warn">Не удалось загрузить базу: ${esc(LOADERR)}. Проверьте интернет.</div><button class="btn pri" data-a="retryload">Попробовать снова</button>`
  : `<div class="card" style="text-align:center"><b style="font-size:20px">Загружаю базу…</b><p class="muted">Первый раз это занимает до минуты. Потом приложение открывается сразу, даже без интернета.</p></div>`}</div>`;
let LOADERR = '';
function tryConnect(s){
  const m = String(s).match(/connect=([A-Za-z0-9_\-=]+)/); if (!m) return false;
  try {
    const j = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')))));
    if (!j.u || !j.k) return false;
    CFG = {u:j.u, k:j.k}; ls.set(CFG_KEY, CFG);
    try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
    DB = null; ls.del(DB_KEY); OUT = []; ls.set(OUT_KEY, OUT);
    firstLoad(); return true;
  } catch(e){ return false; }
}
function firstLoad(){ const p = firstLoadRun(); window.splashHold = p; return p; }
async function firstLoadRun(){
  LOADERR = ''; render();
  try { await pull(true); S = Object.assign(fromTables(), {drafts:S.drafts, wip:S.wip}); SYNC.state = 'ok'; SYNC.last = Date.now(); ls.set('chorsu_last', SYNC.last); HIST.length = 0; R = {s:'home'}; render(); }
  catch(e){ LOADERR = e.message === 'key' ? 'ключ не подходит — нужна новая ссылка подключения' : (navigator.onLine ? 'база не отвечает' : 'нет интернета'); render(); }
}
function loadXLSX(){
  return window.XLSX ? Promise.resolve() : new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
}
async function exportWeek(){
  const ps = periods('cig'); if (!ps.length) return toast('Нет данных за неделю');
  const per = ps[R.pi == null ? ps.length - 1 : R.pi];
  toast('Готовлю файл…');
  try { await loadXLSX(); } catch(e){ return toast('Нет интернета — файл сделать нельзя'); }
  const from = per.from, to = per.to, sold = [['№','Товар','Было ККМ','Было Омбор','Было чёрный','Приход ККМ','Приход Омбор','Приход свои','Возврат','Стало ККМ','Стало Омбор','Стало чёрный','Баланс с офисом','Продано чёрного','Продано всего','Себестоимость','Продажная','Сумма по себест.','Сумма продаж','Прибыль']];
  repProducts('cig').forEach(p => { const c = calc(p.id, from.rows[p.id], to.rows[p.id], from.date, to.date); if (!(c.was || c.inc || c.now)) return; const pr = priceAt(p.id, to.date);
    sold.push([numOf(p.id) || '', p.name, c.a[0]+c.a[1], c.a[2]+c.a[3], c.wasBl, c.pr.kkm, c.pr.om, c.pr.own, c.pr.rkkm + c.pr.rom + c.pr.rown, c.b[0]+c.b[1], c.b[2]+c.b[3], c.nowBl, c.soldOff, c.soldBl, c.sold, pr.cost, pr.sale, c.sold*pr.cost, c.sold*pr.sale, c.sold*(pr.sale-pr.cost)]); });
  const days = [['Дата','День','Приход ККМ','Приход Омбор','Приход свои (чёрный)','Приход товаров','Возвраты','Терминал','Сдано в офис','Корректировка','Долг перед офисом вечером']];
  for (let d = from.date; d < to.date; d = addD(d, 1)){ const x = dayPrihod(d), c = cashOf(d); days.push([dShort(d), WD[pd(d).getDay()], x.kkm, x.om, x.own, x.g, x.rkkm + x.rom + x.rown + x.rg, c.t, c.k, adjOn(d), balanceEnd(d)]); }
  const stock = [['№','Товар','ККМ','Омбор','Чёрный','Себестоимость','Сумма ККМ+Омбор','Сумма чёрного']];
  repProducts('cig').forEach(p => { const r = to.rows[p.id] || Z, c = priceAt(p.id, to.date).cost; const k = r[0]+r[1], o = r[2]+r[3], b = r[4]||0; if (k || o || b) stock.push([numOf(p.id) || '', p.name, k, o, b, c, (k+o)*c, b*c]); });
  const debts = [['Имя','Группа','Долг']]; S.debtors.slice().sort((a,b) => a.ts - b.ts).forEach(d => { const v = debtOf(d.id); if (v) debts.push([d.name, d.grp === 'n' ? 'Несгор' : 'Должник', v]); });
  const wb = XLSX.utils.book_new();
  [['Продажи', sold], ['По дням', days], ['Остатки', stock], ['Долги', debts]].forEach(([n, a]) => { const ws = XLSX.utils.aoa_to_sheet(a); ws['!cols'] = a[0].map((h, i) => ({wch: i === 1 || h === 'Имя' ? 30 : 13})); XLSX.utils.book_append_sheet(wb, ws, n); });
  const blob = new Blob([XLSX.write(wb, {bookType:'xlsx', type:'array'})], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Chorsu ${invShort(from)}-${invShort(to)}.xlsx`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  toast('Файл Excel скачан');
}

function render(){
  const app = document.getElementById('app');
  NEED_RENDER = false;
  if (!CFG){ app.innerHTML = V.connect(); return; }
  if (!DB){ app.innerHTML = V.loading(); return; }
  let h = (V[R.s] || V.home)();
  if (NP) h += npHtml();
  if (CONF) h += confHtml();
  if (TSHEET) h += typeSheetHtml();
  if (TOAST && !NP && !CONF) h += `<div class="toast" role="status">${esc(TOAST)}</div>`;
  const q = document.activeElement && document.activeElement.id === 'q';
  app.innerHTML = h; ANIM = false;
  if (!isText(document.activeElement)) document.body.classList.remove('kb');
  if (q){ const el = document.getElementById('q'); if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
}
// boot: the splash waits for this first update of the base
window.splashResult = () => {
  if (!CFG) return '';
  if (!DB) return LOADERR ? 'Не удалось загрузить базу' : '';
  if (SYNC.state === 'offline') return 'Нет интернета — открываю сохранённые данные';
  if (SYNC.state === 'key') return 'Нужна новая ссылка подключения';
  if (SYNC.state === 'err') return 'База не отвечает — открываю сохранённые данные';
  return '✓ База обновлена';
};
if (location.hash.includes('connect=')) tryConnect(location.hash);
else if (CFG && !DB) firstLoad();
else { render(); window.splashHold = CFG ? sync() : null; }
if (window.splashHold === undefined) window.splashHold = null;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('hashchange', () => { if (location.hash.includes('connect=')) tryConnect(location.hash); });
</script>
