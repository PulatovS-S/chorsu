<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D5C45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Магазин">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<title>Магазин Чорсу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one-column phone app; sticky header; actions live in floating circles bottom-right (thumb zone) */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --sunk:#E3E9E4; --ink:#16201B; --muted:#56645D; --faint:#7A8780; --line:#D3DCD5;
  --accent:#1D5C45; --accent-ink:#FFFFFF; --accent-soft:#DCEBE3;
  --kkm:#2353A3; --kkm-soft:#E1E9F7; --om:#94570F; --om-soft:#F6EAD9; --own:#4B3D69; --own-soft:#E9E4F2; --goods:#16706F; --goods-soft:#DDF0EF; --coral:#C4462E; --sv:#0B6E8F;
  --bad:#BE2E26; --bad-soft:#FBE6E3; --good:#227046; --good-soft:#DFF1E6; --warn:#8A5A00; --warn-soft:#FFF1D2;
  --shadow:rgba(10,30,20,.28);
  --f:"Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101613; --surface:#18211D; --sunk:#202B26; --ink:#EDF2EE; --muted:#A2B0A8; --faint:#6F7D76; --line:#2D3833;
  --accent:#5DBE93; --accent-ink:#0C1A13; --accent-soft:#1E3A2E;
  --kkm:#86AEF0; --kkm-soft:#1C2A44; --om:#E2A75A; --om-soft:#3A2A16; --own:#B9AADF; --own-soft:#2B2540; --goods:#62C9C7; --goods-soft:#163634; --coral:#F08A72; --sv:#5CC8E8;
  --bad:#FF8076; --bad-soft:#3D1D1A; --good:#6FD39A; --good-soft:#173524; --warn:#F0C25E; --warn-soft:#3A2E12; --shadow:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#18211D; --sunk:#202B26; --ink:#EDF2EE; --muted:#A2B0A8; --faint:#6F7D76; --line:#2D3833;
  --accent:#5DBE93; --accent-ink:#0C1A13; --accent-soft:#1E3A2E;
  --kkm:#86AEF0; --kkm-soft:#1C2A44; --om:#E2A75A; --om-soft:#3A2A16; --own:#B9AADF; --own-soft:#2B2540; --goods:#62C9C7; --goods-soft:#163634; --coral:#F08A72; --sv:#5CC8E8;
  --bad:#FF8076; --bad-soft:#3D1D1A; --good:#6FD39A; --good-soft:#173524; --warn:#F0C25E; --warn-soft:#3A2E12; --shadow:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:18px;line-height:1.35;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:210px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink)}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px}
.hrow{display:flex;align-items:center;gap:10px;min-height:52px}
.hdr h1{font-size:clamp(18px,5.6vw,22px);margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .hrow.hr h1{white-space:normal;line-height:1.1;font-size:clamp(17px,5.2vw,21px)}
.hsum-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;column-gap:12px;padding-top:6px}
.hsum-row h1{flex:0 1 auto;font-size:26px;white-space:normal}
.hsum{font-size:32px;font-weight:700;letter-spacing:-.5px;white-space:nowrap;margin-left:auto}
.back{min-height:48px;padding:0 14px 0 8px;border-radius:12px;background:var(--sunk);font-weight:600;font-size:18px;flex:none}
.syncbar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;font-size:15px;padding-block:10px;min-height:48px;background:var(--good-soft);color:var(--good)}
.syncbar b{white-space:nowrap;text-decoration:underline}
.syncbar.warn{background:var(--warn-soft);color:var(--warn)}.syncbar.bad{background:var(--bad-soft);color:var(--bad)}.syncbar.busy{background:var(--sunk);color:var(--muted)}
.demo{font-size:15px;color:var(--warn);background:var(--warn-soft);padding-block:8px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.demo button{font-size:15px;text-decoration:underline;color:var(--warn);padding:0 8px;min-height:44px;min-width:44px}
.stack{display:flex;flex-direction:column;gap:12px;padding-block:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:15px}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.lbl{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.home-date{font-size:26px;font-weight:700;margin:4px 0 0}
.tile{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-height:84px}
.tile .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none}
.tile .ic svg{width:28px;height:28px}
.tile b{display:block;font-size:22px;color:var(--ink)}
.tile span{font-size:15px;color:var(--muted)}
.tile .chev{margin-left:auto;color:var(--muted);font-size:26px}
.tile:active{background:var(--sunk)}
.datenav{display:flex;align-items:center;gap:8px}
.datenav .d{flex:1;min-width:0;text-align:center;font-weight:700;font-size:18px;min-height:58px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;background:var(--surface);border:1px solid var(--line);line-height:1.15}
.datenav .d .dl{white-space:normal}
.datenav .d .ds{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--accent)}
.datenav .d .ds svg{width:14px;height:14px}
.datenav .d:active{background:var(--sunk)}
.datenav button{width:56px;height:52px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:700}
.datenav button:disabled{opacity:.35}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sunk);padding:5px;border-radius:16px}
.seg button{min-height:56px;border-radius:12px;font-weight:700;font-size:17px;color:var(--muted);padding:4px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 0}
.sumrow + .sumrow{border-top:1px dashed var(--line)}
.sumrow b{font-size:20px}
.pill{display:inline-block;font-size:15px;font-weight:700;padding:3px 10px;border-radius:99px;vertical-align:middle}
.p-kkm{background:var(--kkm-soft);color:var(--kkm)}.p-om{background:var(--om-soft);color:var(--om)}.p-own{background:var(--own-soft);color:var(--own)}.p-g{background:var(--goods-soft);color:var(--goods)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:62px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:var(--sunk)}
.num{min-width:40px;font-size:15px;color:var(--muted);font-weight:600}
.row .nm{flex:1;min-width:0;font-size:18px}
.row .rt{font-weight:700;white-space:nowrap;font-size:19px}
.badge{font-weight:700;font-size:16px;padding:4px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.x{width:44px;height:44px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:20px;font-weight:700;flex:none}
.btn{min-height:60px;border-radius:14px;font-weight:700;font-size:19px;padding:0 18px;width:100%}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:2px solid var(--line)}
.btn.give{background:var(--om);color:#fff}
.btn.ret{background:var(--good);color:#fff}
.btn.dang{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:15px;font-weight:600;color:var(--muted)}
.field input,.field select{min-height:60px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:0 14px;font-size:24px;font-weight:700;width:100%;min-width:0}
.field input:focus{border-color:var(--accent);outline:none}
.field.txt input,.field.txt select{font-size:19px;font-weight:500}
/* inventory cells */
.cell{display:flex;flex-direction:column;gap:4px}
.cell label{font-size:16px;font-weight:700}
.cell .box{position:relative}
.cell input{width:100%;min-width:0;height:70px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 10px 16px;font-size:32px;font-weight:700;letter-spacing:-.5px}
.grid3{display:grid;grid-template-columns:1fr 1fr 66px;gap:10px 8px;align-items:end}
.inc{height:70px;border-radius:14px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint);line-height:1.1}
.inc span{font-size:12px;font-weight:600}.inc b{font-size:20px}
.inc.has.kkm{background:var(--kkm-soft);color:var(--kkm)}.inc.has.om{background:var(--om-soft);color:var(--om)}.inc.has.own{background:var(--own-soft);color:var(--own)}
.cell input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cell .was{position:absolute;right:10px;bottom:5px;font-size:14px;color:var(--faint);pointer-events:none;font-weight:500}
.cell.kkm label{color:var(--kkm)}.cell.om label{color:var(--om)}.cell.own label{color:var(--own)}.cell.ret label{color:var(--muted)}
.cell.kkm input{border-color:color-mix(in srgb,var(--kkm) 30%,var(--line));background:color-mix(in srgb,var(--kkm) 6%,var(--surface))}
.cell.om input{border-color:color-mix(in srgb,var(--om) 30%,var(--line));background:color-mix(in srgb,var(--om) 7%,var(--surface))}
.cell.own input{border-color:color-mix(in srgb,var(--own) 30%,var(--line));background:color-mix(in srgb,var(--own) 7%,var(--surface))}
.cell.ret input{border-color:color-mix(in srgb,var(--coral) 25%,var(--line));background:color-mix(in srgb,var(--coral) 5%,var(--surface))}
.cell.ret label{color:var(--coral)!important}
.money{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:84px;padding:12px 16px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);text-align:left}
.money b{font-size:28px}
.money.dirty{border-color:var(--warn)}
.note{border-radius:12px;padding:12px 14px;font-size:16px}
.note.info{background:var(--sunk);color:var(--ink)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.neg{color:var(--bad)!important;font-weight:700}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:10px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th+th,td+td{border-left:1px solid var(--line)}
tr.rowtap{cursor:pointer}tr.rowtap:active td{background:var(--sunk)}
table.wide{border-collapse:separate;border-spacing:0}
table.wide td.stick,table.wide th.stick{position:-webkit-sticky;position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
table.wide th.stick{background:var(--sunk)}
table.wide td.z{color:var(--faint)}
.datebtn{position:relative;display:flex;align-items:center;gap:5px;min-height:48px;padding:0 10px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:16px;white-space:nowrap;flex:none;margin-left:auto}
.datebtn svg{width:20px;height:20px}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 6px}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{font-size:15px;font-weight:600;min-height:22px;padding:0 6px 6px}
.ibal{display:flex;gap:8px;margin-left:auto}
.ibal .b{min-width:84px;border-radius:12px;padding:5px 10px 4px;text-align:center;line-height:1.05}
.ibal .b b{display:block;font-size:26px;font-weight:800}
.ibal .b span{font-size:13px;font-weight:700;letter-spacing:.02em}
.ibal .b.off{background:var(--accent-soft);color:var(--accent)}
.ibal .b.own2{background:color-mix(in srgb, var(--sv) 14%, var(--surface));color:var(--sv)}
.ibal .b.neg{background:var(--bad-soft);color:var(--bad)}
.pmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:-6px}
.pmeta .no{background:var(--sunk);border-radius:99px;padding:4px 12px;font-weight:700;font-size:16px;color:var(--muted)}
.sortbar{display:flex;flex-direction:column;gap:6px}
.sortbar .chips{flex-wrap:wrap;overflow:visible}.sortbar .chip{min-height:42px;font-size:15px;padding:0 13px}
th.sth{cursor:pointer}th.sorted,td.sorted{color:var(--accent)!important;font-weight:700}
.eye{margin-left:auto;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.eye.on{color:var(--own);background:var(--own-soft)}
.eye svg{width:24px;height:24px}
.homehead{display:flex;align-items:center;gap:8px}
.list.sep .row .num{border-right:1px solid var(--line);align-self:stretch;display:flex;align-items:center;justify-content:center;padding-right:10px;margin-right:2px}
.mbal{display:flex;gap:6px}.mbal b{min-width:46px;text-align:center;border-radius:8px;padding:6px 6px;font-size:17px}
.mbal b.off{background:var(--accent-soft);color:var(--accent)}.mbal b.own2{background:color-mix(in srgb, var(--sv) 14%, var(--surface));color:var(--sv)}.mbal b.neg{background:var(--bad-soft);color:var(--bad)}
.dash .homehead{align-items:flex-start}.dash .home-date{margin:0}
.wcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 8px}
.wcard .wh{display:flex;flex-direction:column;text-align:left;width:100%}.wcard .wh b{font-size:19px}.wcard .wh .muted{font-size:14px}
.bars{display:flex;align-items:flex-end;gap:6px;height:104px;margin-top:6px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.bar i{display:block;width:100%;max-width:34px;height:calc(var(--bh,0) * (100% - 34px));border-radius:6px 6px 2px 2px;background:color-mix(in srgb, var(--accent) 55%, var(--surface))}
.bar.today i{background:var(--accent)}
.bar .bv{font-size:10px;color:var(--muted);white-space:nowrap}.bar .bd{font-size:13px;font-weight:700;color:var(--muted)}.bar.today .bd{color:var(--accent)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;min-width:0}
.kpi.wide{grid-column:1/-1}.kpi.wide .kv{font-size:28px}
.kpi .kl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);line-height:1.15}
.kpi .kl i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}.kpi .kl svg{width:18px;height:18px}
.kpi .kv{font-size:clamp(18px,5.4vw,23px);font-weight:800;white-space:nowrap;letter-spacing:-.3px}
.kpi .ks{font-size:13px;color:var(--muted)}
.kpi:active,.wcard:active{background:var(--sunk)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);min-height:96px;text-align:left}
.mgrid button i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}.mgrid button svg{width:26px;height:26px}
.mgrid button b{font-size:18px;line-height:1.15}
.seg.seg5{grid-template-columns:repeat(var(--n,5),1fr);gap:4px}.seg.seg5 button{font-size:14px;padding:0 2px;min-height:50px}
.chips.two{display:grid;grid-template-columns:1fr 1fr;overflow:visible}.chips.two .chip{padding:0 8px;font-size:15px;white-space:normal;line-height:1.15}
.dash{padding-bottom:120px}
.brands{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.brands::-webkit-scrollbar{display:none}
#app .row[data-a]:focus-visible,#app tr.rowtap:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.hdel2{flex:none;margin-left:8px;height:38px;padding:0 12px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;color:var(--bad);background:var(--bad-soft);font-weight:700;font-size:14px}.hdel2 svg{width:18px;height:18px}
.hdr .hrow.hr .hdel2{margin-left:auto}.hdr .hrow.hr h1+.hdel2,.hdr .hrow.hr .datebtn+.hdel2{margin-left:8px}
.ph .phb button.pdel,.ph .pdel{color:var(--bad);display:inline-flex;align-items:center;gap:4px}.ph .pdel svg{width:15px;height:15px}
.hdel{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--bad);background:var(--bad-soft)}.hdel svg{width:22px;height:22px}
.hdr .fab.s.del{color:var(--bad)}
.btn.dang.ghost{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb, var(--bad) 45%, transparent)}
.sheet h2 b{display:inline-block;margin-top:6px;font-size:16px;font-weight:700;color:var(--muted)}
.bchip.more{color:var(--accent);border-style:dashed}
.bsort{flex:none;display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface)}
.bsort button{min-height:38px;padding:0 12px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}.bsort button.on{background:var(--accent-soft);color:var(--accent)}
.brands.all{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none;padding-right:0}
.bchip{flex:none;min-height:40px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.bchip span{font-size:12px;font-weight:700;color:var(--muted);background:var(--sunk);border-radius:99px;padding:1px 7px}
.bchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.bchip.on span{background:color-mix(in srgb, var(--accent-ink) 22%, transparent);color:var(--accent-ink)}
@media (max-width:899px){.brands{gap:5px}.bchip{min-height:38px;padding:0 10px;font-size:14px;gap:5px}.bchip span{padding:1px 6px;font-size:12px}.bsort button{padding:0 10px}}
/* цвета колонок: ККМ · Омбор · Запас · Возврат · Офис · Свой (светлая и тёмная тема) */
.ck{background:color-mix(in srgb, var(--kkm) 9%, transparent)!important}.co{background:color-mix(in srgb, var(--om) 10%, transparent)!important}.cz{background:color-mix(in srgb, var(--own) 10%, transparent)!important}
.cr{background:color-mix(in srgb, var(--coral) 8%, transparent)!important}.cof{background:color-mix(in srgb, var(--accent) 12%, transparent)!important;color:var(--accent);font-weight:700}.csv{background:color-mix(in srgb, var(--sv) 12%, transparent)!important;color:var(--sv);font-weight:700}
th.ck{color:var(--kkm)}th.co{color:var(--om)}th.cz{color:var(--own)}th.cr{color:var(--coral)}
table.stock th{text-align:center}table.stock td.nmc{min-width:150px}table.stock th[rowspan]{vertical-align:middle}
@media(min-width:900px){.cashw{max-width:620px}}
table.cash .cbtn{min-height:44px;min-width:100px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;text-align:right}
table.cash .cbtn.e{color:var(--faint)}table.cash td:nth-child(2),table.cash td:nth-child(3){padding:4px 6px}table.cash tr.today td{background:color-mix(in srgb, var(--accent) 7%, transparent)}
table.cash .cin{width:130px;height:32px;border:1px solid var(--line);border-radius:6px;text-align:right;padding:0 8px;font-weight:700;background:var(--surface)}table.cash .cin.saved{border-color:var(--good);box-shadow:0 0 0 2px color-mix(in srgb, var(--good) 25%, transparent)}table.cash .cin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
tr.chg td{background:color-mix(in srgb, var(--om) 9%, transparent)}
.dinfo{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:16px;line-height:1.35}.dinfo b{white-space:nowrap}.dinfo>b{color:var(--accent)}
kbd{display:inline-block;min-width:22px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface);font:600 12px var(--f);text-align:center;color:var(--ink)}
table.keys2 td{white-space:normal;padding:7px 8px}table.keys2 td:first-child{white-space:nowrap}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dgrid button{min-height:58px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.dgrid button b{font-size:18px}.dgrid button span{font-size:14px;color:var(--muted)}
.dgrid button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chk{display:flex;align-items:center;gap:10px;font-size:18px;min-height:48px}.chk input{width:26px;height:26px}
.range{display:grid;grid-template-columns:1fr 1fr;gap:10px}.range .field{min-width:0}.range input{width:100%;min-width:0;font-size:17px;padding-left:10px;padding-right:6px}
th{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--sunk)}
td.l,th.l{text-align:left}
td.nmc{white-space:normal;text-align:left;width:100%;min-width:120px;overflow-wrap:break-word;line-height:1.25}
td.nmc .sm{font-size:15px;color:var(--muted);margin-top:2px}
td.nmc .n{color:var(--muted);font-size:15px;margin-right:4px}
table.tight th,table.tight td{padding:9px 6px}
table.tight td:first-child,table.tight th:first-child{padding-left:10px}
tr.tot td{font-weight:700;background:var(--sunk)}
table.tight th{font-size:13px;letter-spacing:.02em;white-space:normal;line-height:1.15;vertical-align:bottom}
table.wide th{white-space:nowrap}
table.doc{font-size:15px}table.doc td,table.doc th{padding:9px 5px}table.doc td.nmc{min-width:92px}table.doc td:first-child,table.doc th:first-child{padding-left:9px}
.srow{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow.negrow{background:var(--bad-soft)}
.srow .sold{font-weight:700;font-size:20px;text-align:right}
.srow .sub{font-size:15px;color:var(--muted)}
.detail{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.detail .sumrow b{font-size:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:8px}
.g4 div{min-width:0}.g4 span{display:block;font-size:15px;color:var(--muted)}.g4 b{font-size:clamp(17px,4.8vw,20px);white-space:nowrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:clamp(18px,5.2vw,22px);margin-top:2px;white-space:nowrap}
.stat.badst{background:var(--bad-soft);border-color:transparent}.stat.badst b,.stat.badst .lbl{color:var(--bad)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;min-height:46px;padding:0 16px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:16px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.pname{font-size:38px;font-weight:700;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.3px}
.bal{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:12px;padding:10px 14px;background:var(--sunk)}
.bal b{font-size:26px}
.bal .small{color:var(--muted)}
.bal.badlive{background:var(--bad-soft)}.bal.badlive b,.bal.badlive span{color:var(--bad)}
.ost{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ost.one{grid-template-columns:1fr}
.ost>div{border-radius:14px;padding:9px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.ost .o1{background:var(--accent-soft);color:var(--accent)}.ost .o2{background:color-mix(in srgb, var(--sv) 14%, var(--surface));color:var(--sv)}
.ost span{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}.ost b{font-size:30px;font-weight:800;line-height:1.1}.ost small{font-size:13px;color:var(--muted);font-weight:600}
table.igrid td.ost1,table.igrid th.ost1{background:color-mix(in srgb, var(--accent) 9%, transparent);color:var(--accent);font-weight:800}
table.igrid td.ost2,table.igrid th.ost2{background:color-mix(in srgb, var(--sv) 10%, transparent);color:var(--sv);font-weight:800}
.hint{font-size:15px;color:var(--own);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:20px}
.hint button{background:var(--own-soft);color:var(--own);border-radius:8px;padding:0 12px;min-height:44px;font-weight:700;font-size:15px}
.sec-h{font-size:15px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 -4px}
.empty-st{padding:22px;text-align:center;color:var(--muted)}
.doc-ic{width:70px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:700;font-size:15px}
/* floating actions */
.fabs{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px;z-index:8}
.fabs.up{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
@media (max-width:899px){body.kb .fabs{display:none}}
.fab{width:70px;height:70px;border-radius:50%;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px var(--shadow);display:grid;place-items:center}
.fab svg{width:32px;height:32px}.fab .fl{display:none}
.fab.s{width:60px;height:60px;background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.fab.s svg{width:28px;height:28px}
.fab.dirty{box-shadow:0 0 0 5px var(--warn-soft),0 6px 18px var(--shadow)}
.fab:active{transform:scale(.95)}
.fabw{display:flex;flex-direction:column;align-items:center;gap:4px}
.fab-cap{font-size:15px;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:1px 8px;border-radius:8px;white-space:nowrap}
.banner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:14px 16px;font-weight:700;font-size:17px}
.banner b{margin-left:auto;white-space:nowrap}
.dpick{position:relative}
.dpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.amt-pos{color:var(--om)}.amt-neg{color:var(--good)}
.rowtap{cursor:pointer}
.botbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.botbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 74px 1.4fr;gap:10px}
.botbar .btn{padding:0 8px;white-space:nowrap}
.botbar .sbtn{border-radius:14px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px}.botbar .sbtn svg{width:24px;height:24px}
/* search bar */
.sbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 69px);z-index:4;background:var(--bg);padding-block:10px;display:flex;gap:8px}
.sbar input{flex:1;min-width:0;min-height:56px;border-radius:14px;border:2px solid var(--accent);background:var(--surface);padding:0 16px;font-size:20px}
.sbar input:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.sbar button{width:56px;border-radius:14px;background:var(--sunk);font-size:22px;font-weight:700}
.hdr.tall + .sbar{top:calc(env(safe-area-inset-top,0px) + 128px)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;max-height:92%;overflow:auto}
.sheet h2{margin:0;font-size:22px;line-height:1.2}
.disp{background:var(--sunk);border-radius:14px;padding:0 16px;text-align:right;font-size:44px;font-weight:700;height:72px;line-height:72px;letter-spacing:-.5px;overflow:hidden;white-space:nowrap}
.disp.empty{color:var(--muted);font-weight:500}
.npx{font-size:15px;color:var(--muted);text-align:right;height:20px;line-height:20px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:62px;border-radius:14px;background:var(--sunk);font-size:28px;font-weight:600;touch-action:manipulation}
.keys button:active{background:var(--line)}
.sheet-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.typebtn{display:flex;align-items:center;gap:14px;min-height:72px;border-radius:16px;padding:0 18px;font-size:21px;font-weight:700;text-align:left;width:100%}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:700;z-index:30;font-size:18px;max-width:calc(100% - 130px)}
.botbar ~ .toast{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.ov.anim .sheet{animation:up .18s ease-out}
@media (prefers-reduced-motion:reduce){.ov.anim .sheet{animation:none}}

<body>
<div id="splash" aria-hidden="true"><svg id="splashSvg" viewBox="190 240 620 520" preserveAspectRatio="xMidYMid meet"></svg></div>
<style>
#splash{position:fixed;inset:0;z-index:100;background:#1D5C45;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease}
#splash svg{width:100%;height:100%;max-width:640px}
#splash.out{opacity:0;pointer-events:none}
</style>
<script>
/* Заставка «Магазин Чорсу» — плоская 2D-векторная анимация.
   Детерминированный таймлайн: render(t) рисует кадр для времени t (секунды).
   Используется и для экспорта видео, и как заставка в приложении. */
(function (root) {
  const C = { bg: '#1D5C45', dark: '#12382B', light: '#F2F5F0', amber: '#E8B05A', coral: '#D9573B' };
  const DUR = 2.7;
  const NS = 'http://www.w3.org/2000/svg';
  // --- easing ---
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;       // ease-in-out cubic
  const io5 = x => x < .5 ? 16 * Math.pow(x, 5) : 1 - Math.pow(-2 * x + 2, 5) / 2; // stronger ease-in-out
  const out = x => 1 - Math.pow(1 - x, 3);
  const back = (x, s = 1.4) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
  const lerp = (a, b, k) => a + (b - a) * k;
  const mix = (c1, c2, k) => { const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); const a = p(c1), b = p(c2); return '#' + a.map((v, i) => Math.round(lerp(v, b[i], k)).toString(16).padStart(2, '0')).join(''); };
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const set = (e, attrs) => { for (const k in attrs) e.setAttribute(k, attrs[k]); };

  // --- layout in a 1000×1000 logical square ---
  const CX = 500;
  const COUNTER_Y = 660, LEFT = 262, RIGHT = 738;          // прилавок
  const TOP = 312;                                         // верх ставни / навеса
  const SHELF1 = 486, SHELF2 = 632;                        // полки
  const PW = 74, PH = 104;                                 // пачка
  const packX = i => 300 + (i % 4) * 112;                  // 4 в ряд
  const packs = [0, 1, 2, 3, 4, 5, 6, 7].map(i => ({
    i, x: packX(i), floor: i < 4 ? SHELF1 : SHELF2,
    body: [C.amber, C.coral, C.light, C.amber, C.coral, C.light, C.amber, C.coral][i],
    band: [C.light, C.light, C.coral, C.light, C.light, C.amber, C.light, C.light][i],
    drop: 0.98 + [0, 1, 2, 3, 4, 5, 6, 7][i] * 0.07
  }));
  // буква «Ч» из трёх планок
  const CH = { L: [418, 438, 46, 118], M: [418, 520, 164, 46], R: [536, 438, 46, 226] };
  const target = [CH.L, CH.M, CH.M, CH.R, CH.L, CH.M, CH.R, CH.R];
  const FINAL_AWN = { x: 384, y: 352, w: 232 };            // навес над буквой
  const WORD = 'Магазин Чорсу', WORD_Y = 772;

  function mount(svg, opts = {}) {
    const font = opts.font || "'Golos Text', 'Segoe UI', Roboto, Arial, sans-serif";
    svg.innerHTML = '';
    const defs = el('defs', {}, svg);
    const clip = el('clipPath', { id: 'csWordClip' }, defs); el('rect', { x: -500, y: WORD_Y - 80, width: 2000, height: 96 }, clip);
    const kclip = el('clipPath', { id: 'csKiosk' }, defs); el('rect', { x: LEFT, y: TOP + 26, width: RIGHT - LEFT, height: 420 }, kclip);
    el('rect', { x: -2000, y: -2000, width: 5000, height: 5000, fill: C.bg }, svg);
    const cam = el('g', {}, svg);
    // прилавок
    const counter = el('line', { x1: CX, y1: COUNTER_Y, x2: CX, y2: COUNTER_Y, stroke: C.light, 'stroke-width': 10, 'stroke-linecap': 'round' }, cam);
    // полки
    const shelves = [SHELF1, SHELF2].map(y => el('rect', { x: LEFT + 14, y, width: RIGHT - LEFT - 28, height: 9, rx: 4.5, fill: C.dark }, cam));
    const posts = [LEFT + 14, RIGHT - 23].map(x => el('rect', { x, y: TOP + 40, width: 9, height: COUNTER_Y - TOP - 40, rx: 4.5, fill: C.dark }, cam));

    const packG = el('g', { 'clip-path': 'url(#csKiosk)' }, cam);

      const g = el('g', {}, packG);

    });

    const shutter = el('rect', { x: LEFT, width: RIGHT - LEFT, fill: C.light }, cam);
    const slats = [0, 1, 2, 3, 4, 5].map(() => el('rect', { x: LEFT + 18, width: RIGHT - LEFT - 36, height: 6, rx: 3, fill: C.bg, opacity: .16 }, cam));

    const scal = [0, 1, 2, 3, 4, 5].map(k => el('path', { fill: k % 2 ? C.amber : C.light }, cam));
    // буква «Ч»: финальные планки и скругление угла
    function measure(){}               // надписи больше нет — оставлено для совместимости

    function scallops(x, y, w, n, drop) { // drop[k] 0..1 — насколько опущен каждый фестон
      const sw = w / n;
      scal.forEach((s, k) => {
        const d = drop[k], r = sw / 2, h = r * 1.0 * d;
        const x0 = x + k * sw;
        s.setAttribute('d', `M${x0} ${y} h${sw} v${h * 0.15} a${r} ${Math.max(h, .01)} 0 0 1 ${-sw} 0 Z`);
        s.setAttribute('opacity', d > 0.01 ? 1 : 0);
      });
    }

    function render(t) {
      t = clamp(t, 0, DUR);
      // камера: наезд 1.12→1.00, откат на сборке, посадка
      const push = io(seg(t, 0, 2.1));
      const s = lerp(1.14, 1.0, push);
      const cy = lerp(540, 486, io(seg(t, 0.2, 2.1)));
      set(cam, { transform: `translate(${CX} 500) scale(${s}) translate(${-CX} ${-cy})` });

      // 1) прилавок рисуется из центра
      const draw = io(seg(t, 0.0, 0.38));
      const collapse = 0;                                         // магазин остаётся до конца
      const halfW = lerp(0, (RIGHT - LEFT) / 2, draw) * (1 - collapse);
      set(counter, { x1: CX - halfW, x2: CX + halfW, opacity: 1 });

      // ставня вырастает из линии (морф: линия → прямоугольник), затем сворачивается вверх
      const grow = io(seg(t, 0.28, 0.72)), roll = io(seg(t, 0.78, 1.12));
      const shTop = lerp(COUNTER_Y, TOP, grow);
      const shBottom = lerp(COUNTER_Y, TOP + 24, roll);
      const shH = Math.max(shBottom - shTop, 0);
      set(shutter, { y: shTop, height: shH, opacity: (grow > 0 && roll < 1) ? 1 : 0 });
      slats.forEach((sl, k) => { const y = shTop + 36 + k * 52; set(sl, { y, opacity: (y < shBottom - 12 && grow > .6) ? .16 : 0 }); });

      // рулон → планка навеса → навес над буквой
      const toFinal = 0;
      const barShow = roll > 0.92 || t > 1.1;
      const bx = lerp(LEFT - 10, FINAL_AWN.x, toFinal), bw = lerp(RIGHT - LEFT + 20, FINAL_AWN.w, toFinal);
      const by = lerp(TOP - 6, FINAL_AWN.y, toFinal), bh = lerp(26, 22, toFinal);
      set(bar, { x: bx, y: by, width: bw, height: bh, opacity: barShow ? 1 : 0 });
      const drops = scal.map((_, k) => back(seg(t, 1.12 + k * 0.07, 1.42 + k * 0.07), 1.2));
      scallops(bx, by + bh - 1, bw, 6, drops);

      // полки и стойки появляются, когда ставня уходит, и тают при сборке
      const shelfIn = io(seg(t, 0.82, 1.1)), shelfOut = 0;
      shelves.forEach((sh, k) => { const w = (RIGHT - LEFT - 28) * shelfIn * (1 - shelfOut * .6); set(sh, { x: CX - w / 2, width: w, opacity: 1 - shelfOut }); });
      posts.forEach(p => set(p, { opacity: shelfIn * (1 - shelfOut) }));

      // 2) пачки: падают по очереди с приседанием, 3) сливаются в «Ч»
      const merge = 0;
      packs.forEach((p, k) => {
        const e = packEls[k];
        const fall = seg(t, p.drop, p.drop + 0.26);
        const land = seg(t, p.drop + 0.26, p.drop + 0.48);                  // касание и отскок
        let sx = 1, sy = 1, y;
        if (fall < 1){ sy = 1 + 0.12 * fall; sx = 1 - 0.06 * fall; y = lerp(p.floor - PH - 140, p.floor - PH * sy, Math.pow(fall, 2.2)); }
        else { const sq = Math.sin(Math.PI * land) * (1 - land); sy = 1 - 0.22 * sq; sx = 1 + 0.16 * sq; y = p.floor - PH * sy; }
        const w = PW * sx, h = PH * sy, x = p.x + (PW - w) / 2;
        // слияние в планку буквы
        const tg = target[k], m = merge;
        const fx = lerp(x, tg[0], m), fy = lerp(y, tg[1], m), fw = lerp(w, tg[2], m), fh = lerp(h, tg[3], m);
        const vis = t >= p.drop ? 1 : 0;
        set(e.body, { x: fx, y: fy, width: fw, height: fh, rx: lerp(7, 4, m), fill: p.body });
        const bandH = fh * 0.24 * (1 - m);
        set(e.band, { x: fx, y: fy + fh * 0.16 * (1 - m), width: fw, height: bandH, opacity: 1 - m });
        set(e.shade, { x: fx + fw * 0.68, y: fy, width: fw * 0.32 * (1 - m), height: fh, opacity: .14 * (1 - m) });
        set(e.g, { opacity: vis });
      });
      // скругление внутреннего угла «Ч» проявляется после слияния
      set(packG, { 'clip-path': 'url(#csKiosk)' });
    }

  }

(function(){
  // Заставка: анимация магазина + звук. В приложение пускает сразу по окончании анимации — база обновляется в фоне.

/* ---------- бренды: группировка товаров («Milano», «Kent», …) ---------- */
const BTR = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'j','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'x','ц':'c','ч':'ch','ш':'sh','щ':'sh','ъ':'','ы':'i','ь':'','э':'e','ю':'yu','я':'ya'};
const BALIAS = {sigaronne:'cigaronne', parlament:'parliament', l:'ld', tera:'terea', demokrat:'democrat'};
const BNAME = {ld:'LD', pall:'Pall Mall', john:'John Player', cigaronne:'Cigaronne', lucky:'Lucky Strike', pine:'Pine', blooming:'Blooming'};
function brandKey(name){ let w = String(name || '').trim().split(/\s+/)[0].toLowerCase().replace(/[а-яё]/g, c => BTR[c]); w = w.replace(/x\d.*$/, '').replace(/[^0-9a-z&.]/g, '').replace(/\.+$/, ''); return BALIAS[w] || w || '—'; }
let BRC = {}, BRK = '';
function brands(cat){
  const k = DATAV + '|' + S.products.length; if (BRK !== k){ BRC = {}; BRK = k; }
  if (BRC[cat]) return BRC[cat];
  const g = {}, order = [];
  repProducts(cat).forEach(p => { const key = brandKey(p.name), w = p.name.trim().split(/\s+/)[0]; if (!g[key]){ g[key] = {key, names:{}, ids:[]}; order.push(key); } g[key].ids.push(p.id); g[key].names[w] = (g[key].names[w] || 0) + 1; });
  const list = [], other = {key:'~', name:'Другие', ids:[]}, of = {};
  order.forEach(key => { const x = g[key]; if (x.ids.length < 2){ other.ids.push(...x.ids); return; }
    const nm = Object.keys(x.names).sort((a, b) => (/^[A-Za-z]/.test(b) - /^[A-Za-z]/.test(a)) || x.names[b] - x.names[a])[0];
    list.push({key, name: BNAME[key] || (nm.length > 3 && nm === nm.toUpperCase() ? nm[0] + nm.slice(1).toLowerCase() : nm), ids:x.ids}); });
  if (other.ids.length) list.push(other);
  list.forEach(b => b.ids.forEach(id => of[id] = b.key));
  return BRC[cat] = Object.assign(list, {of});
}
let USEC = null, USEK = '', BRALL = false, FSORT = (() => { try { return localStorage.getItem('chorsu_fsort') !== '0'; } catch(e){ return true; } })();
function useScore(){   // как часто товар приходил за последние 60 дней (число приходов)
  const k = DATAV + '|' + S.prihod.length + '|' + TODAY; if (USEK === k && USEC) return USEC;
  const from = addD(TODAY, -60), c = {}; S.prihod.forEach(x => { if (x.date >= from && !isRet(x.type)) c[x.pid] = (c[x.pid] || 0) + 1; });
  USEK = k; return USEC = c;
}
function byUse(arr, idOf = x => x.id){   // «★ Частые»: сначала самые частые, при равенстве — по номеру
  if (!FSORT) return arr; const sc = useScore();
  return arr.map((x, i) => [x, i, sc[idOf(x)] || 0]).sort((a, b) => b[2] - a[2] || a[1] - b[1]).map(x => x[0]);
}
const brandOk = (p, cat) => { if (!R.brand || R.brand === '*' || (R.q && R.q.trim())) return true; return brands(cat || p.cat).of[p.id] === R.brand; };
// ids — товары, которые реально показаны на этом экране (до выбора бренда): по ним и считаются цифры на кнопках
function brandChips(cat, ids, opts = {}){
  const all = brands(cat), cnt = {}; ids.forEach(id => { const k = all.of[id]; if (k) cnt[k] = (cnt[k] || 0) + 1; });
  const list = all.filter(b => cnt[b.key]), sc = useScore(), use = b => b.ids.reduce((s, id) => s + (sc[id] || 0), 0);
  if (R.brand && R.brand !== '*' && !cnt[R.brand]) R.brand = '';
  const chip = (k, l, n) => `<button class="bchip ${(R.brand || '') === k ? 'on' : ''}" data-a="brand" data-v="${k}">${esc(l)}${n != null ? `<span>${n}</span>` : ''}</button>`;
  const srt = opts.sort === false ? '' : `<span class="bsort" role="group" aria-label="Порядок"><button class="${FSORT ? 'on' : ''}" data-a="fsort" data-v="1" title="Сначала товары, которые приходят чаще">★ Частые</button><button class="${FSORT ? '' : 'on'}" data-a="fsort" data-v="0" title="По номеру в таблице">${DESK ? '№ По номеру' : '№'}</button></span>`;
  const allL = DESK ? 'Все товары' : 'Все';
  if (list.length < 3) return `<div class="brands">${chip('', allL, ids.length)}${srt}</div>`;
  const N = DESK ? 12 : 5, need = list.length > N + 1;
  let shown = list;
  if (need && !BRALL){ const top = new Set(list.filter(b => b.key !== '~').slice().sort((a, b) => use(b) - use(a) || cnt[b.key] - cnt[a.key]).slice(0, N).map(b => b.key));
    shown = list.filter(b => top.has(b.key) || b.key === R.brand); if (FSORT) shown = shown.slice().sort((a, b) => (b.key === R.brand) - (a.key === R.brand) || use(b) - use(a)); }
  else if (FSORT) shown = list.slice().sort((a, b) => (a.key === '~') - (b.key === '~') || use(b) - use(a));
  const more = need ? `<button class="bchip more" data-a="ballt">${BRALL ? 'Свернуть ▴' : DESK ? `Все бренды · ${list.length} ▾` : 'Бренды ▾'}</button>` : '';
  return `<div class="brands ${BRALL && need ? 'all' : ''}" role="tablist" aria-label="Бренды">${chip('', allL, ids.length)}${srt}${more}${shown.map(b => chip(b.key, b.name, cnt[b.key])).join('')}</div>`;
}
function prodRows(cat, q, right, act, sub){
  const ql = q.trim().toLowerCase();
  const items = byUse(ordered(cat).map((p,i) => ({p, n:i+1})).filter(({p,n}) => (!ql || String(n) === ql || match(p.name, ql)) && brandOk(p, cat)), x => x.p.id);

}

function barChart(points, opts = {}){ // points: [{lbl, v, title}] — один ряд, столбики

  const labEvery = Math.ceil(n / 5);
  points.forEach((p, i) => { const x = padL + i * bw + gap / 2, w = Math.max(2, bw - gap), y0 = y(0), y1 = y(p.v), h = Math.abs(y0 - y1), yy = Math.min(y0, y1);
    const neg = p.v < 0, r = Math.min(4, w / 2, h);
    const path = neg ? `M${x} ${yy}h${w}v${h-r}a${r} ${r} 0 0 1 ${-r} ${r}h${-(w-2*r)}a${r} ${r} 0 0 1 ${-r} ${-r}Z` : `M${x} ${yy+h}v${-(h-r)}a${r} ${r} 0 0 1 ${r} ${-r}h${w-2*r}a${r} ${r} 0 0 1 ${r} ${r}v${h-r}Z`;
    g += `<path d="${h > 0 ? path : ''}" fill="${neg ? 'var(--bad)' : (i === n - 1 ? 'var(--accent)' : 'color-mix(in srgb, var(--accent) 62%, var(--surface))')}"/>`;
    g += `<rect x="${padL + i * bw}" y="${padT}" width="${bw}" height="${H - padT - padB}" fill="transparent" data-tip="${esc(p.title || p.lbl)}: ${fmt(p.v)}${opts.unit||''}" class="hit"/>`;
    if (i % labEvery === 0 || i === n - 1) g += `<text x="${Math.min(W - 30, Math.max(padL + 24, x + w/2))}" y="${H - 10}" text-anchor="middle" font-size="21" fill="var(--muted)">${esc(p.lbl)}</text>`; });
  return `<div class="chart"><div class="tip" id="ctip">${esc(opts.hint || 'Нажмите на столбик, чтобы увидеть цифру')}</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'График')}">${g}</svg></div>`;

function openNP(o){ NP = Object.assign({val:''}, o); NP.fresh = !!NP.val; TOAST = null; ANIM = true; render(); }
const qtyWarn = n => n >= 1000 ? ' · ⚠ Проверьте: очень большое количество' : '';
function npDisp(){ const v = NP.val, n = Number(v||0); return v ? (NP.mask ? '•'.repeat(v.length) : fmt(n)) : (NP.money ? '0 сум' : '0'); }
const npOver = n => NP.max != null && n > NP.max;   // больше допустимого: «Готово» серая, касание объясняет почему
function npHtml(){
  const n = Number(NP.val||0), over = npOver(n);
  return `<div class="ov ${ANIM?'anim':''}"><div class="sheet" role="dialog" aria-label="${esc(NP.title)}">
    <h2>${esc(NP.title)}</h2>${NP.subFn || NP.sub ? `<div class="muted small" id="npsub">${NP.subFn ? NP.subFn() : NP.sub}</div>` : ''}
    <div class="disp ${NP.val?'':'empty'}" id="npdisp">${npDisp()}</div>
    <div class="npx ${over ? 'neg' : ''}" id="npx" role="status">${over ? esc(NP.maxMsg || '') : NP.extra ? NP.extra(n) : ''}</div>
    ${NP.fill ? `<button class="btn sec" data-a="npfill">${esc(NP.fill.l)} · ${fmt(NP.fill.v)}</button>` : ''}
    <div class="npkb small muted" style="display:none">Можно печатать цифрами на клавиатуре · Enter — готово · Esc — отмена</div>
    <div class="keys">${['1','2','3','4','5','6','7','8','9', NP.money?'000':'00','0','⌫'].map(k => `<button data-a="npk" data-v="${k}">${k}</button>`).join('')}</div>
    <div class="sheet-btns"><button class="btn sec" data-a="npclose">Отмена</button><button class="btn ${NP.okDang ? 'dang' : 'pri'} ${over ? 'off' : ''}" id="npok" data-a="npok" ${NP.allowZero || n>0 ? '' : 'disabled'}>${NP.ok || 'Записать'}</button></div>
    ${NP.onDel ? `<button class="btn dang" data-a="npdel">${NP.delL || 'Удалить строку'}</button>` : ''}
  </div></div>`;
}
function npUpdate(){
  const n = Number(NP.val||0), d = document.getElementById('npdisp');
  d.textContent = npDisp(); d.classList.toggle('empty', !NP.val);
  const x = document.getElementById('npx'), over = npOver(n), ok = document.getElementById('npok');
  if (over || NP.extra || x.classList.contains('neg')){ x.textContent = over ? NP.maxMsg || '' : NP.extra ? NP.extra(n) : ''; x.classList.toggle('neg', over); }
  ok.disabled = !(NP.allowZero || n>0); ok.classList.toggle('off', over);
}

  const p = P(pid); if (!p) return null; const inv = invList(p.cat).slice(-1)[0]; if (!inv) return null;
  const r = inv.rows[pid], pr = prihodSum(pid, inv.date);
  const base = p.cat === 'goods' ? ((r || [0])[0] || 0) : (r ? r[0] + r[1] + r[2] + r[3] + (own ? r[4] || 0 : 0) : 0);
  const inc = p.cat === 'goods' ? pr.g - pr.rg : pr.kkm + pr.om - pr.rkkm - pr.rom + (own ? pr.own - pr.rown : 0);

const posStock = pid => stockNow(pid, posOwn());
function dayTotals(date){
  const z = {n:0, sum:0, cash:0, card:0, debt:0, rn:0, rsum:0, rcash:0, rcard:0, rdebt:0, pcash:0, pcard:0, pn:0, cn:0, change:0};
  (S.sales || []).forEach(s => { if (s.date !== date) return; if (s.status === 'cancel'){ z.cn++; return; }
    if (s.kind === 'sale'){ z.n++; z.sum += s.total; z.cash += s.cash; z.card += s.card; z.debt += s.debt; z.change += s.change; }
    else if (s.kind === 'ret'){ z.rn++; z.rsum += s.total; z.rcash += s.cash; z.rcard += s.card; z.rdebt += s.debt; }
    else if (s.kind === 'pay'){ z.pn++; z.pcash += s.cash; z.pcard += s.card; } });
  z.drawer = z.cash + z.pcash - z.rcash; z.cardAll = z.card + z.pcard - z.rcard; return z;   // возврат «в счёт долга» наличных в кассе не уменьшает
}
/* буква устройства в номере чека — только из его имени: «К-12» — «Касса», «П-5» — «ПК», «Т-3» — «Телефон»; цифра в конце имени
   добавляется к букве («Касса 2» → «К2-…»). От чеков других устройств буква не зависит — номер не меняется задним числом. */
const devTag = n => { n = String(n || '').trim(); return (n[0] || '?').toUpperCase() + ((n.match(/\d+$/) || [''])[0]); };

  const tg = devTag(name), seen = new Set();

}

function dayLog(date){   // «Удалено из чеков» за день: удалённые и очищенные строки минус возвращённые «Вернуть»

function posTotal(doc){ return (doc || posCur()).lines.reduce((a, l) => a + l.qty * linePrice(l), 0); }
function posAdd(pid, unit, qty){
  const p = P(pid); if (!p) return;
  if (POS.price){ POS.price = false; POS.msg = ''; POS.ov = {k:'info', pid}; return render(); }
  unit = unit === 'b' && blockOf(p) ? 'b' : 'p';
  const price = unitPrice(pid, unit);
  if (!(price > 0)){ posBeep(); POS.ov = {k:'noprice', pid, unit}; return render(); }   // за 0 не продаём
  if (POS.mul){ qty = POS.mul; POS.mul = 0; }

/* ПИН кассира: после 5 неверных подряд — пауза 1 минута (общая для входа и ПИН управляющего) */
const PINLOCK_KEY = 'chorsu_pinlock';
const pinLock = () => ls.get(PINLOCK_KEY, {n:0, until:0});
const pinLocked = () => pinLock().until > Date.now();
const lockLeft = () => { const s = Math.max(0, Math.ceil((pinLock().until - Date.now()) / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const lockText = () => `Подождите ${lockLeft()} — было 5 неверных ПИН подряд`;
const pinOk = () => ls.set(PINLOCK_KEY, {n:0, until:0});
function pinFail(){ const x = pinLock(); x.n++; if (x.n >= 5){ x.n = 0; x.until = Date.now() + 60000; lockTick(); } ls.set(PINLOCK_KEY, x); }
function lockTick(){ clearInterval(lockTick.h); lockTick.h = setInterval(() => { const on = pinLocked(); if (!on) clearInterval(lockTick.h);
  const el = document.getElementById('plerr'); if (R.s === 'pos' && !POSU && el) el.textContent = on ? lockText() : 'Можно вводить ПИН'; }, 1000); }

  openNP({title:'ПИН управляющего', sub:esc(title), mask:true, allowZero:true, ok:'Подтвердить', onOk:async () => { const v = NP.val;
    if (pinLocked()){ NP.val = ''; npUpdate(); return sub(`<span class="neg">${esc(lockText())}</span>`); }

    pinFail(); NP.val = ''; npUpdate(); sub(`<span class="neg">${pinLocked() ? esc(lockText()) : 'Неверный ПИН'}</span>`); }});

async function pinHash(id, pin){
  const enc = new TextEncoder(), key = await crypto.subtle.importKey('raw', enc.encode(String(pin)), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode('chorsu|' + id), iterations:60000, hash:'SHA-256'}, key, 256);
  return btoa(String.fromCharCode(...new Uint8Array(bits)));
}

/* отчёт «Продажи за неделю»: сколько пробито на кассе против инвентаризации */
function posCmp(rows, per){
  let q = 0, sum = 0, inv = 0, bad = 0; rows.forEach(r => { const k = posSold(r.p.id, per.from.date, per.to.date); if (!k) return; q += k; sum += k * r.pr.sale; const v = sv(r.c); inv += v; if (Math.abs(v - k) > Math.max(2, k * 0.1)) bad++; });
  if (!q) return '';
  return `<div class="card" style="padding:12px 14px"><div class="lbl">По кассе (пробито чеками)</div><div class="g4">
    <div><span>Пробито, пачек</span><b>${fmt(q)}</b></div><div><span>На сумму</span><b>${fmt(sum)}</b></div>
    <div><span>По инвентаризации (эти товары)</span><b>${fmt(inv)}</b></div><div><span>Не пробито</span><b style="color:var(${inv - q > 0 ? '--warn' : '--good'})">${fmt(inv - q)}</b></div></div>
    ${bad ? `<div class="small muted" style="margin-top:6px">У ${bad} товаров касса и инвентаризация расходятся больше чем на 10%.</div>` : ''}</div>`;
}

/* сканер и клавиатура на кассе: цифры + Enter без поля ввода = штрихкод.
   Сканер в окнах (оплата, количество, ПИН, принять долг) и в поиске узнаём по скорости: ≥ 6 символов с интервалом < 50 мс
   и сразу Enter — так человек не печатает. Такой ввод ничего не меняет в окне и не подтверждает его. */
let SCANBUF = '', SCANT = 0;
const KB = {t:0, n:0, buf:'', snap:null};
// время нажатия клавиши (e.timeStamp), а не обработки: на медленном ПК перерисовка окна растягивает обработку до 50–110 мс,
// а сканер по-прежнему шлёт клавиши через 8 мс
const keyT = e => e.timeStamp || performance.now();
function kbTrack(e, snap){   // очередной символ; snap() — что было в окне до начала быстрой серии
  const t = keyT(e); if (t - KB.t >= 50){ KB.n = 0; KB.buf = ''; KB.snap = snap ? snap() : null; }
  KB.t = t; KB.n++; KB.buf += e.key;
}
const kbIsScan = e => KB.n >= 6 && keyT(e) - KB.t < 150;
const kbDone = () => { KB.t = 0; KB.n = 0; KB.buf = ''; KB.snap = null; };
function npScanned(){   // сканер в цифровом окне: вернуть, как было, и подсказать
  const sn = KB.snap; kbDone(); if (sn){ NP.val = sn.val; NP.fresh = sn.fresh; } npUpdate(); posBeep();
  const x = document.getElementById('npx'); if (x){ x.textContent = 'Это сканер — сначала закройте окно. Товар не добавлен'; x.classList.add('neg'); }
}
document.addEventListener('keydown', e => {
  if (R.s === 'bcbind' && e.key === 'Enter' && e.target.id === 'bc_code'){ e.preventDefault(); const code = e.target.value.trim(); if (!code) return; const old = S.barcodes[code];
    R.bc = old ? {code:'', msg:`${code} уже привязан: ${(P(old.pid) || {}).name} (${old.unit === 'b' ? 'блок' : 'пачка'})`, err:true} : {code, q:'', msg:''}; render(); setTimeout(() => { const n = document.getElementById(old ? 'bc_code' : 'bc_q'); if (n) n.focus(); }); return; }
  if (e.key === 'Enter' && e.target.id === 'e_bc'){ e.preventDefault(); e.stopPropagation(); return A.sbcadd({v:'p'}); }
  if (R.s !== 'pos' || NP || CONF || !DB) return;
  const k = e.key;
  if (!POSU && posHasUsers()){   // экран ПИН кассира: штрихкод не должен «набрать» ПИН
    if (/^[0-9]$/.test(k)){ e.preventDefault(); kbTrack(e, () => POS.pin || ''); if (KB.n >= 2){ POS.pin = KB.snap || ''; const el = document.getElementById('plpin'); if (el) el.innerHTML = '•'.repeat(POS.pin.length) || '&nbsp;'; } else A.plk({v:k}); }
    else if (k === 'Backspace'){ e.preventDefault(); A.plk({v:'⌫'}); }
    else if (k === 'Enter' && KB.n >= 2){ e.preventDefault(); kbDone(); posBeep(); POS.pinErr = 'Сначала войдите по ПИН — штрихкод не принят'; render(); }
    e.stopPropagation(); return; }
  e.stopPropagation();
  const t = e.target, inInput = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
  if (POS.chg && !['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'NumLock'].includes(k)){ POS.chg = null; render(); if (k === 'Escape' || (k === 'Enter' && !SCANBUF)){ e.preventDefault(); return; } }   // окно сдачи — до любого действия кассира
  if (POS.pay && !inInput){
    if (/^[0-9]$/.test(k)){ e.preventDefault(); kbTrack(e, () => Object.assign({}, POS.pay)); return A.ppk({v:k}); }
    if (k === 'Backspace'){ e.preventDefault(); return A.ppk({v:'⌫'}); }
    if (k === 'Enter'){ e.preventDefault();
      if (kbIsScan(e)){ const sn = KB.snap; kbDone(); Object.assign(POS.pay, sn || {}, {msg:'Сначала закройте оплату — товар не добавлен'}); posBeep(); return render(); }
      kbDone(); const b = document.querySelector('[data-a="ppok"]'); if (b && !b.disabled) posClose(); return; }
    if (k === 'Escape'){ e.preventDefault(); return A.ppcancel(); }
    return;
  }
  if (k === 'Escape' && POS.ov){ e.preventDefault(); POS.ov = null; payResume(); return render(); }
  if (inInput && t.id === 'pq'){
    if (k.length === 1){ kbTrack(e, () => t.value); return; }
    if (k !== 'Enter') return;
    e.preventDefault();
    if (kbIsScan(e)){ const code = KB.buf, was = KB.snap || ''; kbDone(); t.value = POS.q = was; posScan(code); return; }   // сканер при фокусе в поиске: товар — в чек, текст поиска — как был
    kbDone(); const v = t.value.trim(); if (!v) return;
    if (S.barcodes[v]){ POS.q = ''; posScan(v); return; }
    const it = posTiles(); if (it.length === 1){ POS.q = ''; posAdd(it[0].id, 'p', 1); return; }
    if (/^\d{6,}$/.test(v)){ POS.q = ''; posScan(v); } return; }
  if (inInput) return;
  if ((e.ctrlKey || e.metaKey) && k === 'Enter'){ e.preventDefault(); return A.ppay(); }
  if (k === 'F2'){ e.preventDefault(); return A.pcashq(); }
  if (k === 'F3'){ e.preventDefault(); return A.pcardq(); }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const now = keyT(e); if (now - SCANT > 600) SCANBUF = ''; SCANT = now;
  if (k === 'Enter'){ if (SCANBUF.length >= 3){ e.preventDefault(); const c = SCANBUF; SCANBUF = ''; posScan(c); } return; }
  if (k === '*' && /^\d{1,3}$/.test(SCANBUF)){ e.preventDefault(); POS.mul = +SCANBUF || 0; SCANBUF = ''; POS.msg = POS.mul ? `Следующий товар × ${POS.mul}` : ''; return render(); }   // «5 *» — количество следующего товара
  if (k.length === 1 && /^[\p{L}\p{N}]$/u.test(k)){
    if (!SCANBUF && /^\p{L}$/u.test(k)){ e.preventDefault(); kbTrack(e, () => ''); const q = document.getElementById('pq');   // любая буква (рус., узб., лат.) начинает поиск
      if (q){ q.focus(); q.value = POS.q = k; q.dispatchEvent(new Event('input', {bubbles:true})); } return; }
    SCANBUF += k; }
  if (k === '+'){ e.preventDefault(); A.pplus(); } else if (k === '-'){ e.preventDefault(); A.pminus(); } else if (k === 'Delete'){ e.preventDefault(); A.pdel(); }
}, true);
/* 10 минут без касаний и чек пуст — касса закрывается на ПИН (открытый чек остаётся) */

const DEVID = (() => { let v = ls.get('chorsu_devid', ''); if (!v){ v = 'D' + uid() + uid(); ls.set('chorsu_devid', v); } return v; })();

/* ---------- журнал действий (лист «Журнал»): кто, когда, что сделал; удалённое хранится, чтобы восстановить ---------- */
function logAct(act, doc, docId, docDate, no, desc, sum, data, who){
  if (!DB) return;
  const now = Date.now(), x = {id:'g' + uid() + uid(), date:TODAY, time:hhmm(now), ts:now, who:who || whoAmI(), dev:devName(), act, doc, docId:docId || '', docDate:docDate || '', no:String(no || ''), desc:desc || '', sum:Math.round(sum || 0), data:data == null ? '' : typeof data === 'string' ? data : JSON.stringify(data)};
  if (x.data.length > 45000) x.data = '';   // ячейка Таблицы — до 50 000 знаков
  const r = [x.id, x.date, x.time, x.ts, x.who, x.dev, x.act, x.doc, x.docId, x.docDate, x.no, x.desc, x.sum, x.data];
  SDB.actlog[x.id] = r; persistRow('actlog', x.id); S.actlog.push(x); queue([{t:'actlog', id:x.id, row:r}]); schedulePush();
}
function logInvDel(inv){ const sm = invSums(inv); logAct('Удалён', inv.cat === 'cig' ? 'Инвентаризация сигарет' : 'Инвентаризация товаров', inv.id, evDate(inv), '', sm.n + ' товаров', inv.cat === 'cig' ? sm.k + sm.o : sm.q, {inv:JSON.parse(JSON.stringify(inv))}); }
let LGX = null, LGXK = '';
function logIdx(){ const k = S.actlog.length + '|' + DATAV; if (LGXK === k && LGX) return LGX; LGX = {}; S.actlog.forEach(x => { if (!x.docId) return; const o = LGX[x.docId] = LGX[x.docId] || {first:null, last:null, n:0}; if (!o.first) o.first = x; o.last = x; o.n++; }); LGXK = k; return LGX; }
const fmtTs = ts => { if (!ts) return ''; const d = new Date(ts); return dShort(iso(d)) + ' ' + hhmm(ts); };

  return `<div class="dmeta small muted">Создал: <b>${esc(o.first.who)}</b> ${fmtTs(o.first.ts)}${o.n > 1 ? ` · изменил: <b>${esc(o.last.who)}</b> ${fmtTs(o.last.ts)}` : ''} · <button class="lnk" data-a="jdoc" data-v="${esc(id)}">история (${o.n})</button></div>`; }

/* ---------- панели инструментов: одна для документов, одна для отчётов (как «Панель управления» Logix) ---------- */
function toolBar(btns, mid, opt = {}){
  const b = x => `<button class="tb ${x.pri ? 'pri' : ''} ${x.dang ? 'dang' : ''} ${x.dirty ? 'dirty' : ''}" data-a="${x.a}" ${x.v != null ? `data-v="${x.v}"` : ''} ${x.dis ? 'disabled' : ''} title="${esc(x.l)}${x.k ? ' (' + x.k + ')' : ''}">${ICON[x.i] || `<span class="ti">${x.i}</span>`}<span class="tl">${esc(x.l)}</span></button>`;
  const tail = (opt.search ? [{a:'search', i:'search', l:'Найти', k:'Ctrl+F'}] : []).concat(opt.refresh ? [{a:'syncnow', i:'⟳', l:'Обновить'}] : []).concat(opt.xls ? [{a:'xlsx', i:'⬇', l:'Excel'}] : []).concat(opt.print ? [{a:'print', i:'🖨', l:'Печать', k:'Ctrl+P'}] : []);
  return `<div class="tbar wrap"><div class="tbin">${btns.map(b).join('')}${mid ? `<span class="tmid">${mid}</span>` : ''}${tail.length ? `<span class="tsp"></span>${tail.map(b).join('')}` : ''}</div></div>`;
}
const PERQ = [['today', 'Сегодня'], ['yest', 'Вчера'], ['week', '7 дней'], ['month', 'Месяц']];
function periodCtl(single){
  if (single) return `<span class="tper"><button class="tarr" data-a="pershift" data-v="-1" aria-label="Раньше">‹</button><input type="date" data-in="per" data-k="date" value="${R.date}" max="${TODAY}" aria-label="Дата"><button class="tarr" data-a="pershift" data-v="1" aria-label="Позже" ${R.date >= TODAY ? 'disabled' : ''}>›</button></span><span class="tq">${PERQ.slice(0, 2).map(([k, l]) => `<button class="chip" data-a="perq" data-v="${k}">${l}</button>`).join('')}</span>`;
  return `<span class="tper"><button class="tarr" data-a="pershift" data-v="-1" aria-label="Раньше">‹</button><input type="date" data-in="per" data-k="from" value="${R.from}" max="${TODAY}" aria-label="С"><span class="muted">—</span><input type="date" data-in="per" data-k="to" value="${R.to}" max="${TODAY}" aria-label="По"><button class="tarr" data-a="pershift" data-v="1" aria-label="Позже" ${R.to >= TODAY ? 'disabled' : ''}>›</button></span><span class="tq">${PERQ.map(([k, l]) => `<button class="chip" data-a="perq" data-v="${k}">${l}</button>`).join('')}</span>`;
}
const repBar = (single, extra, opt) => toolBar([], periodCtl(single) + (extra || ''), Object.assign({xls:1, print:1, refresh:1}, opt || {}));
const daysIn = (a, b) => Math.round((pd(b) - pd(a)) / 864e5) + 1;
function setPer(k){
  if (k === 'today'){ R.from = R.to = R.date = TODAY; }
  else if (k === 'yest'){ R.from = R.to = R.date = addD(TODAY, -1); }
  else if (k === 'week'){ R.to = TODAY; R.from = addD(TODAY, -6); R.date = TODAY; }
  else if (k === 'month'){ R.to = TODAY; R.from = TODAY.slice(0, 8) + '01'; R.date = TODAY; }
}

/* ---------- касса: документы «Приход в кассу» и «Расход из кассы» (v18, вместо «Терминал и касса») ---------- */
function legacyCash(){   // записи «Терминал и касса» до v18 — показываются как документы того же дня
  const out = []; Object.keys(S.cash).forEach(d => { const c = S.cash[d];
    if (c.t) out.push({id:'L' + d + 't', date:d, dir:'out', kind:'term', kassa:'card', amt:c.t, note:'запись до v18', legacy:'t', ts:0});
    if (c.k) out.push({id:'L' + d + 'k', date:d, dir:'out', kind:'office', kassa:'cash', amt:c.k, note:'запись до v18', legacy:'k', ts:0}); });

// все движения денег: документы кассы, чеки POS (наличные/карта), погашения долга в «Долгах»
function cashOps(from, to, opt = {}){
  const c0 = cash0().date, ops = [], ok = d => d >= from && d <= to && d >= c0;

  const pos = {}; (S.sales || []).forEach(s => { if (s.status === 'cancel' || !ok(s.date)) return; const sg = s.kind === 'ret' ? -1 : 1, nm = s.kind === 'sale' ? 'Продажа (касса)' : s.kind === 'ret' ? 'Возврат по чеку' : 'Погашение долга (касса)';
    [['cash', s.cash], ['card', s.card]].forEach(([k, v]) => { if (!v) return;
      if (opt.bySale || s.kind !== 'sale') ops.push({date:s.date, ts:s.ts, kassa:k, amt:sg * v, kind:nm, desc:'Чек ' + saleNo(s) + (s.cname ? ' · ' + s.cname : ''), src:'sale', ref:s.id, who:s.seller});
      else { const key = s.date + k, o = pos[key] = pos[key] || {date:s.date, ts:s.ts, kassa:k, amt:0, kind:nm, n:0, src:'posday', ref:s.date}; o.amt += v; o.n++; o.ts = Math.max(o.ts, s.ts); } }); });
  Object.values(pos).forEach(o => { o.desc = o.n + ' ' + plural(o.n, 'чек', 'чека', 'чеков'); ops.push(o); });
  const dn = {}; S.debtors.forEach(d => dn[d.id] = d.name);
  S.moves.forEach(m => { if (m.amt < 0 && !m.sale && ok(m.date)) ops.push({date:m.date, ts:0, kassa:m.kassa || 'cash', amt:-m.amt, kind:'Погашение долга', desc:dn[m.did] || '', src:'move', ref:m.did}); });

function cashBal(date){   // остаток вечером дня: {cash, card} или null, если день раньше начала учёта кассы

}

function restoreFromLog(id){

  if (d.a){ if ((S.adj || []).some(z => z.id === d.a.id)) return toast('Запись уже есть'); S.adj.push(Object.assign({}, d.a)); return done('Корректировка восстановлена'); }

  toast('Этот вид записи восстановить нельзя');
